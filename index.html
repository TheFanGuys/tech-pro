                  <div style={{fontWeight:700,fontSize:11,color:T.textSub,marginBottom:6}}>📞 {bdata.phone}</div>
                  <div style={{color:T.textMid,fontSize:12,lineHeight:1.6,marginBottom:8}}>{bdata.note}</div>
                  <div style={{display:"flex",flexDirection:"column",gap:8}}>
                    {(bdata.manualLinks||[]).length>0 && (
                      <button onClick={()=>{ setManualBrandFilter(brand); setManualSearch(""); setTab(6); }}
                        style={{display:"flex",alignItems:"center",justifyContent:"center",gap:6,width:"100%",background:T.green,color:"#fff",
                          border:"none",borderRadius:8,padding:"11px 14px",fontSize:13,fontWeight:800,
                          fontFamily:"'Nunito',sans-serif",cursor:"pointer"}}>
                        📚 View {brand} Manuals ({(bdata.manualLinks||[]).length}) →
                      </button>
                    )}
                    {TORQUE_DATA[brand] && (
                      <button onClick={()=>{ setTorqueBrandFilter(brand); setTorqueSearch(""); setTab(7); }}
                        style={{display:"flex",alignItems:"center",justifyContent:"center",gap:6,width:"100%",background:T.accent,color:"#fff",
                          border:"none",borderRadius:8,padding:"11px 14px",fontSize:13,fontWeight:800,
                          fontFamily:"'Nunito',sans-serif",cursor:"pointer"}}>
                        🔧 View {brand} Torque Specs →
                      </button>
                    )}
                    {/* Brand Page button — opens the dedicated brand reference (Tab 10) */}
                    {BRAND_THEMES[brand] && (() => {
                      const bt = BRAND_THEMES[brand];
                      const fg = bt.needsDarkText ? "#0F1419" : "#FFFFFF";
                      return (
                        <button onClick={()=>setTab(10)}
                          style={{display:"flex",alignItems:"center",justifyContent:"center",gap:6,width:"100%",
                            background:`linear-gradient(180deg, ${bt.primary} 0%, ${bt.primaryDk} 100%)`,
                            color:fg, border:"none", borderRadius:8, padding:"11px 14px",
                            fontSize:13, fontWeight:900,
                            fontFamily:"'Nunito',sans-serif", cursor:"pointer",
                            letterSpacing:0.3,
                            boxShadow:`0 2px 4px ${bt.primary}40`}}>
                          🏷 Open {brand} Brand Page →
                        </button>
                      );
                    })()}
                  </div>
                </div>
              )}

              {/* Video resources */}
              {bdata?.videos?.length>0 && (
                <div style={{background:T.purpleBg,border:`1px solid ${T.purpleBd}`,borderRadius:8,padding:"10px 12px",marginTop:10,marginBottom:bdata.warningNote?10:0}}>
                  <div style={{fontWeight:800,fontSize:12,color:T.purple,marginBottom:8}}>📺 Video Resources</div>
                  <div style={{display:"flex",flexDirection:"column",gap:6}}>
                    {(bdata.videos||[]).map((v,i)=>(
                      <a key={i} href={v.url} target="_blank" rel="noreferrer"
                        style={{display:"flex",alignItems:"flex-start",gap:10,background:"#fff",border:`1px solid ${T.purpleBd}`,borderRadius:6,padding:"8px 10px",textDecoration:"none"}}>
                        <span style={{fontSize:18,flexShrink:0}}>▶</span>
                        <div>
                          <div style={{fontWeight:800,fontSize:12,color:T.purple,lineHeight:1.3}}>{v.label}</div>
                          <div style={{fontSize:11,color:T.textSub,marginTop:2}}>{v.desc}</div>
                        </div>
                      </a>
                    ))}
                  </div>
                </div>
              )}

              {/* Warning note */}
              {bdata?.warningNote && (
                <div style={{background:T.orangeBg,border:`1.5px solid ${T.orangeBd}`,borderRadius:8,padding:"10px 14px",marginTop:10}}>
                  <div style={{fontWeight:700,color:T.orange,fontSize:12,lineHeight:1.7}}>{bdata.warningNote}</div>
                </div>
              )}
            </div>

            {/* Generate button */}
            <button onClick={()=>{
              if(!brand) return;
              const b = brands[brand];
              // Check for custom overrides first — if set, use them directly
              if(b.paramOverrides?.length>0) {
                // Replace [FLA] placeholder with actual motor FLA
                const flaStr = motor?.fla ? motor.fla.toFixed(1)+" A" : "— A";
                setParams(b.paramOverrides.map(row=>({
                  ...row,
                  v: row.v.replace(/\[FLA\]/gi, flaStr)
                })));
              } else {
                // Run the auto builder
                const builder = PARAM_BUILDERS[b.paramType];
                if(builder) {
                  const d = diameter || modelName?.match(/(\d+)ft/)?.[1] || "14";
                  setParams(builder(d, motor, voltage));
                }
              }
            }} style={{width:"100%",padding:13,marginBottom:16,background:brand?T.accent:"#9CA3AF",border:"none",borderRadius:10,color:"#fff",cursor:brand?"pointer":"not-allowed",fontFamily:"'Nunito',sans-serif",fontWeight:900,fontSize:14,letterSpacing:"0.06em",boxShadow:brand?"0 2px 10px rgba(29,78,216,0.25)":"none"}}>
              ▶ Generate VFD Parameters
            </button>

            {/* Params table */}
            {params.length>0 && (
              <ParamsTable
                params={params}
                brand={brand}
                bdata={bdata}
                motor={motor}
                brands={brands}
              />
            )}
          </div>
        )}

        {/* ══════════════════════════════════════════════════════════
            TAB 1 — FAULT LOOKUP
        ══════════════════════════════════════════════════════════ */}
        {tab===1 && (
          <div>
            <SectionHead title="Fault Code Lookup" sub={brand?`${bdata.vfd} — tap a fault for full diagnosis`:"Select a brand in Fan Setup to see its fault codes"}/>
            {!brand && (
              <div style={{background:T.yellowBg,border:`1px solid ${T.yellowBd}`,borderRadius:8,padding:"12px 14px",marginBottom:12,color:T.yellow,fontWeight:700,fontSize:13}}>
                💡 Select a manufacturer in the Fan Setup tab to see their specific fault codes and diagnostic steps.
              </div>
            )}
            {faults.length>0 && (
              <div style={{display:"flex",flexDirection:"column",gap:8,marginBottom:14}}>
                {faults.map((f,i)=>{
                  const active = activeFault?.code===f.code;
                  const sc = f.sev==="crit"?T.red:f.sev==="high"?T.orange:T.yellow;
                  const sb = f.sev==="crit"?T.redBd:f.sev==="high"?T.orangeBd:T.yellowBd;
                  const sbg = f.sev==="crit"?T.redBg:f.sev==="high"?T.orangeBg:T.yellowBg;
                  return (
                    <div key={i} style={{border:`2px solid ${active?sb:T.border}`,borderRadius:10,overflow:"hidden"}}>
                      {/* Tappable header */}
                      <button onClick={()=>setActiveFault(active?null:f)}
                        style={{display:"block",width:"100%",background:active?sbg:T.surface,border:"none",
                          padding:"11px 13px",cursor:"pointer",textAlign:"left",fontFamily:"'Nunito',sans-serif"}}>
                        <div style={{display:"flex",alignItems:"center",gap:8}}>
                          <span style={{fontWeight:900,fontSize:13,color:sc,fontFamily:"monospace"}}>{f.display}</span>
                          <span style={{fontSize:12,color:T.text,fontWeight:700,flex:1}}>{f.label}</span>
                          <span style={{fontSize:13,color:T.textSub,fontWeight:900}}>{active?"▲":"▼"}</span>
                        </div>
                        {!active && <div style={{fontSize:11,color:T.textSub,lineHeight:1.4,marginTop:4}}>{f.cause?.substring(0,70)}…</div>}
                      </button>
                      {/* Inline detail — opens right here */}
                      {active && (
                        <div style={{background:T.surface,borderTop:`1px solid ${sb}`,padding:"12px 14px"}}>
                          <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:10}}>
                            <SevBadge sev={f.sev}/>
                          </div>
                          <div style={{background:T.bg,border:`1px solid ${T.border}`,borderRadius:8,padding:"10px 12px",marginBottom:12}}>
                            <span style={{fontWeight:800,color:T.textMid,fontSize:12}}>Root Cause: </span>
                            <span style={{color:T.textMid,fontSize:13}}>{f.cause}</span>
                          </div>
                          <div style={{fontSize:11,fontWeight:800,color:T.textSub,letterSpacing:"0.1em",marginBottom:8}}>DIAGNOSTIC STEPS</div>
                          {(f.steps||[]).map((s,si)=>{
                            const isWarn = s.startsWith("⚠")||s.startsWith("LOTO")||s.startsWith("NOTE");
                            return (
                              <div key={si} style={{display:"flex",gap:10,marginBottom:9,alignItems:"flex-start"}}>
                                <div style={{background:isWarn?T.red:T.accent,color:"#fff",borderRadius:"50%",width:24,height:24,display:"flex",alignItems:"center",justifyContent:"center",fontSize:10,fontWeight:900,flexShrink:0}}>{isWarn?"!":si+1}</div>
                                <div style={{color:isWarn?T.red:T.textMid,fontSize:13,lineHeight:1.6,fontWeight:isWarn?700:400}}>{s}</div>
                              </div>
                            );
                          })}
                        </div>
                      )}
                    </div>
                  );
                })}
              </div>
            )}
          </div>
        )}

        {/* ══════════════════════════════════════════════════════════
            TAB 2 — ELECTRICAL CHECKS
        ══════════════════════════════════════════════════════════ */}
        {tab===2 && (
          <div>
            <SectionHead title="Electrical Troubleshooting" sub="Tap ✓ to mark done · Tap 'How to Test' for step-by-step"/>
            {ELEC_TESTS.map((item,i)=>(
              <div key={i}>
                <div style={{background:checks[i]?T.greenBg:T.surface,border:`1.5px solid ${checks[i]?T.greenBd:T.border}`,borderRadius:10,padding:"11px 14px",marginBottom:openTest===i?0:8,borderBottomLeftRadius:openTest===i?0:10,borderBottomRightRadius:openTest===i?0:10,borderBottom:openTest===i?"none":""}}>
                  <div style={{display:"flex",gap:10,alignItems:"flex-start"}}>
                    <div onClick={()=>setChecks(p=>({...p,[i]:!p[i]}))}
                      style={{width:22,height:22,borderRadius:6,flexShrink:0,marginTop:2,border:`2px solid ${checks[i]?T.green:T.borderDk}`,background:checks[i]?T.green:"#fff",display:"flex",alignItems:"center",justifyContent:"center",color:"#fff",fontWeight:900,fontSize:13,cursor:"pointer"}}>
                      {checks[i]?"✓":""}
                    </div>
                    <div style={{flex:1}}>
                      <div style={{fontWeight:700,fontSize:13,color:checks[i]?T.green:T.text,marginBottom:5}}>{item.label}</div>
                      <div style={{display:"flex",gap:6,flexWrap:"wrap",marginBottom:6}}>
                        <span style={{background:T.accentLt,color:T.accent,border:`1px solid ${T.accentBd}`,borderRadius:4,padding:"2px 7px",fontSize:11,fontWeight:700}}>SPEC: {item.spec}</span>
                        <span style={{background:T.bg,color:T.textSub,border:`1px solid ${T.border}`,borderRadius:4,padding:"2px 7px",fontSize:11,fontWeight:700}}>TOOL: {item.tool}</span>
                      </div>
                      <button onClick={()=>setOpenTest(openTest===i?null:i)}
                        style={{background:openTest===i?T.accent:T.bg,border:`1.5px solid ${openTest===i?T.accent:T.border}`,borderRadius:6,padding:"4px 10px",color:openTest===i?"#fff":T.textSub,fontFamily:"'Nunito',sans-serif",fontSize:11,fontWeight:800,cursor:"pointer"}}>
                        {openTest===i?"▲ Hide":"▼ How to Test"}
                      </button>
                    </div>
                  </div>
                </div>
                {openTest===i && (
                  <div style={{background:"#1E293B",border:`1.5px solid ${T.accent}`,borderTop:"none",borderRadius:"0 0 10px 10px",padding:16,marginBottom:8}}>
                    {item.steps.map((s,si)=>(
                      <div key={si} style={{display:"flex",gap:10,marginBottom:8,alignItems:"flex-start"}}>
                        <div style={{background:s.startsWith("⚠")?"#B91C1C":"#1D4ED8",color:"#fff",borderRadius:"50%",width:22,height:22,display:"flex",alignItems:"center",justifyContent:"center",fontSize:10,fontWeight:900,flexShrink:0}}>
                          {s.startsWith("⚠")?"!":si+1}
                        </div>
                        <div style={{color:s.startsWith("⚠")?"#FCA5A5":"#CBD5E1",fontSize:12,lineHeight:1.6,fontWeight:s.startsWith("⚠")?700:400}}>{s}</div>
                      </div>
                    ))}
                  </div>
                )}
              </div>
            ))}
            <div style={{textAlign:"center",color:T.textSub,fontSize:13,fontWeight:700,padding:"8px 0"}}>
              {Object.values(checks).filter(Boolean).length} / {ELEC_TESTS.length} complete
            </div>
            <button onClick={()=>setChecks({})} style={{width:"100%",padding:10,background:T.surface,border:`1.5px solid ${T.border}`,borderRadius:8,color:T.textSub,fontFamily:"'Nunito',sans-serif",fontSize:13,fontWeight:700,cursor:"pointer"}}>
              ↺ Reset Checklist
            </button>
          </div>
        )}

        {/* ══════════════════════════════════════════════════════════
            TAB 3 — FIELD NOTES
        ══════════════════════════════════════════════════════════ */}
        {tab===3 && (
          <div>
            <SectionHead title="Field Notes" sub={brand?`${brand} — brand-specific wiring and programming procedures`:"Select a brand in Fan Setup to see its field notes"}/>
            {!brand && (
              <div style={{background:T.yellowBg,border:`1px solid ${T.yellowBd}`,borderRadius:8,padding:"12px 14px",color:T.yellow,fontWeight:700,fontSize:13}}>
                💡 Select a manufacturer in Fan Setup to see brand-specific field notes and wiring procedures.
              </div>
            )}
            {brand && (bdata?.fieldNotes||[]).length===0 && (
              <div style={{background:T.bg,border:`1px solid ${T.border}`,borderRadius:8,padding:"12px 14px",color:T.textSub,fontSize:13}}>
                No field notes added yet for {brand}. Go to Settings → Field Notes to add procedures.
              </div>
            )}
            {(bdata?.fieldNotes||[]).map((sec,si)=>{
              const fc = NOTE_COLORS[sec.color] || NOTE_COLORS.blue;
              return (
                <div key={si} style={{background:fc.bg,border:`1.5px solid ${fc.border}`,borderRadius:12,padding:14,marginBottom:14}}>
                  <div style={{marginBottom:10}}>
                    <span style={{background:fc.badge,border:`1px solid ${fc.border}`,borderRadius:20,padding:"3px 14px",fontSize:13,fontWeight:900,color:fc.head}}>{sec.title}</span>
                  </div>
                  {(sec.steps||[]).map((step,i)=>(
                    <div key={i} style={{display:"flex",gap:10,alignItems:"flex-start",background:"rgba(255,255,255,0.8)",borderRadius:8,padding:"9px 10px",border:`1px solid ${fc.border}`,marginBottom:6}}>
                      <div style={{background:fc.head,color:"#fff",borderRadius:6,padding:"3px 10px",fontWeight:900,fontSize:11,flexShrink:0,fontFamily:"monospace",minWidth:90,textAlign:"center"}}>{step.param}</div>
                      <div style={{flex:1}}>
                        <div style={{fontWeight:800,fontSize:13,color:T.text}}>{step.value}</div>

                      </div>
                    </div>
                  ))}

                    <div style={{marginTop:10,background:"rgba(255,255,255,0.9)",borderRadius:8,padding:"9px 12px",fontSize:12,color:fc.head,fontWeight:700,border:`1px solid ${fc.border}`,lineHeight:1.7}}>
                      {sec.footer}
                    </div>
                  )}
                </div>
              );
            })}
          </div>
        )}

        {/* ══════════════════════════════════════════════════════════
            TAB 4 — CALCULATORS
        ══════════════════════════════════════════════════════════ */}
        {tab===4 && (
          <div>
            <SectionHead title="Field Calculators & Reference" sub="Voltage drop, Ohm's Law, wire ampacity, wiring rules"/>
            <div style={{display:"flex",gap:6,flexWrap:"wrap",marginBottom:14}}>
              {["⚡ Voltage Drop","🔢 Ohm's Law","📊 Wire Ampacity","📋 Reference"].map((t,i)=>(
                <button key={i} onClick={()=>setCalcTab(i)}
                  style={{padding:"7px 12px",background:calcTab===i?T.accent:T.surface,border:`1.5px solid ${calcTab===i?T.accent:T.border}`,borderRadius:20,color:calcTab===i?"#fff":T.textSub,fontFamily:"'Nunito',sans-serif",fontSize:11,fontWeight:800,cursor:"pointer"}}>
                  {t}
                </button>
              ))}
            </div>

            {/* Voltage Drop */}
            {calcTab===0 && (
              <div style={{background:T.surface,border:`1px solid ${T.border}`,borderRadius:12,padding:16}}>
                <div style={{fontWeight:900,fontSize:15,color:T.text,marginBottom:12}}>⚡ Voltage Drop Calculator</div>
                <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:12}}>
                  <div><label style={{fontSize:11,fontWeight:700,color:T.textSub,display:"block",marginBottom:4}}>SUPPLY VOLTAGE (V)</label><input type="number" value={vdV} onChange={e=>setVdV(e.target.value)} style={SINP()}/></div>
                  <div><label style={{fontSize:11,fontWeight:700,color:T.textSub,display:"block",marginBottom:4}}>LOAD CURRENT (A)</label><input type="number" value={vdA} onChange={e=>setVdA(e.target.value)} placeholder="Motor FLA" style={SINP()}/></div>
                  <div><label style={{fontSize:11,fontWeight:700,color:T.textSub,display:"block",marginBottom:4}}>ONE-WAY RUN LENGTH (ft)</label><input type="number" value={vdFt} onChange={e=>setVdFt(e.target.value)} placeholder="e.g. 150" style={SINP()}/></div>
                  <div><label style={{fontSize:11,fontWeight:700,color:T.textSub,display:"block",marginBottom:4}}>WIRE GAUGE</label>
                    <select value={vdAwg} onChange={e=>setVdAwg(e.target.value)} style={{...SINP(),cursor:"pointer"}}>
                      {AWG_DATA.map(w=><option key={w.awg} value={w.awg}>#{w.awg} AWG ({w.mm2} mm²)</option>)}
                    </select></div>
                  <div><label style={{fontSize:11,fontWeight:700,color:T.textSub,display:"block",marginBottom:4}}>PHASE</label>
                    <select value={vdPh} onChange={e=>setVdPh(e.target.value)} style={{...SINP(),cursor:"pointer"}}>
                      <option value="3">3-Phase</option><option value="1">Single Phase</option>
                    </select></div>
                </div>
                {vdResult ? (
                  <div style={{background:vdResult.ok?T.greenBg:T.redBg,border:`1.5px solid ${vdResult.ok?T.greenBd:T.redBd}`,borderRadius:10,padding:"14px 16px"}}>
                    <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:10}}>
                      <div style={{textAlign:"center"}}><div style={{fontSize:11,fontWeight:700,color:T.textSub}}>VOLTAGE DROP</div><div style={{fontSize:26,fontWeight:900,color:vdResult.ok?T.green:T.red}}>{vdResult.drop} V</div></div>
                      <div style={{textAlign:"center"}}><div style={{fontSize:11,fontWeight:700,color:T.textSub}}>% DROP</div><div style={{fontSize:26,fontWeight:900,color:vdResult.ok?T.green:T.red}}>{vdResult.pct}%</div></div>
                    </div>
                    <div style={{textAlign:"center",fontWeight:800,fontSize:13,color:vdResult.ok?T.green:T.red}}>
                      {vdResult.ok?"✅ ACCEPTABLE — Within NEC 3% guideline":"❌ EXCEEDS 3% — Upsize wire gauge or reduce run length"}
                    </div>
                  </div>
                ) : <div style={{color:T.textSub,fontSize:13,textAlign:"center",padding:12}}>Enter all values above to calculate</div>}
              </div>
            )}

            {/* Ohm's Law */}
            {calcTab===1 && (
              <div style={{background:T.surface,border:`1px solid ${T.border}`,borderRadius:12,padding:16}}>
                <div style={{fontWeight:900,fontSize:15,color:T.text,marginBottom:4}}>🔢 Ohm's Law Calculator</div>
                <div style={{fontSize:12,color:T.textSub,marginBottom:14}}>Enter any two known values, then press Solve.</div>
                <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:14}}>
                  {[{label:"VOLTAGE (V) — Volts",val:oV,set:setOV,key:"V"},{label:"CURRENT (I) — Amps",val:oI,set:setOI,key:"I"},{label:"RESISTANCE (R) — Ohms",val:oR,set:setOR,key:"R"},{label:"POWER (P) — Watts",val:oP,set:setOP,key:"P"}].map(f=>(
                    <div key={f.key}>
                      <label style={{fontSize:11,fontWeight:700,color:T.textSub,display:"block",marginBottom:4}}>{f.label}</label>
                      <div style={{display:"flex",gap:6}}>
                        <input type="number" value={f.val} onChange={e=>f.set(e.target.value)} style={{...SINP(),flex:1}}/>
                        <button onClick={()=>solveOhm(f.key)} style={{padding:"7px 10px",background:T.accent,border:"none",borderRadius:6,color:"#fff",fontFamily:"'Nunito',sans-serif",fontSize:11,fontWeight:800,cursor:"pointer",flexShrink:0}}>Solve</button>
                      </div>
                    </div>
                  ))}
                </div>
                <div style={{background:T.accentLt,border:`1px solid ${T.accentBd}`,borderRadius:10,padding:"12px 14px"}}>
                  <div style={{fontWeight:800,fontSize:13,color:T.accent,marginBottom:8}}>Formulas</div>
                  <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:6}}>
                    {["V = I × R","I = V ÷ R","R = V ÷ I","P = V × I","P = I² × R","P = V² ÷ R"].map(f=>(
                      <div key={f} style={{background:"#fff",borderRadius:6,padding:"6px 10px",fontFamily:"monospace",fontSize:13,fontWeight:700,color:T.text,border:`1px solid ${T.border}`}}>{f}</div>
                    ))}

                  <label style={{display:"block",fontSize:11,fontWeight:800,color:T.textSub,letterSpacing:"0.06em",marginBottom:4}}>WIDTH (ft)</label>
                  <input type="number" value={spaceWid} onChange={e=>setSpaceWid(e.target.value)} placeholder="e.g. 360" style={INP()}/>
                </div>
              </div>
              {(() => {
                // Ceiling height gates max fan size: need diameter + roof clearance + blade ~10ft off floor.
                // From GFY data: 24ft fan needs ~29ft ceiling, scales down from there.
                const ceil = parseFloat(spaceCeil);
                const SIZES=[8,10,12,14,16,18,20,22,24];
                const minCeilFor=d=>d+(d>=16?5:4)+0; // diameter + roof clearance
                let maxFan=0; SIZES.forEach(d=>{ if(!isNaN(ceil) && ceil>=minCeilFor(d)) maxFan=d; });
                return (
                  <div>
                    <label style={{display:"block",fontSize:11,fontWeight:800,color:T.textSub,letterSpacing:"0.06em",marginBottom:4}}>
                      FAN DIAMETER {(maxFan>0) && <span style={{color:T.green}}>(max ~{maxFan}ft at {ceil}ft ceiling)</span>}
                      {(!isNaN(ceil) && maxFan===0) && <span style={{color:T.red}}>(ceiling too low for HVLS — need 12ft+)</span>}
                    </label>
                    <select value={spaceDia} onChange={e=>setSpaceDia(e.target.value)} style={{...INP(),cursor:"pointer"}}>
                      {SIZES.map(k=><option key={k} value={String(k)}>{k} ft{((maxFan>0)&&(k>maxFan))?" — too big for ceiling":""}</option>)}
                    </select>
                  </div>
                );
              })()}
            </div>

            {(() => {
              const d = parseFloat(spaceDia), len = parseFloat(spaceLen), wid = parseFloat(spaceWid), ceil = parseFloat(spaceCeil);
              if (isNaN(d) || isNaN(len) || isNaN(wid) || len<=0 || wid<=0) return null;
              // DESTRAT spacing = fan-to-fan max (widest, fewest fans). From GFY Z-Tech data.
              const MAXF = {6:55,8:70,10:95,12:115,14:130,16:150,18:165,20:165,22:165,24:180};
              const destratSp = MAXF[d] || Math.round(d*8.5);
              // WORKING spacing = tighter for people-cooling. ~100ft for a 24ft fan at 30-40ft ceiling.
              // Taller ceiling = can space a bit wider (air spreads more); lower = tighter.
              // Base working spacing ≈ destrat × 0.6, nudged by ceiling height.
              let workSp = Math.round(destratSp * 0.6);
              if (!isNaN(ceil)) {
                if (ceil >= 35) workSp = Math.round(workSp * 1.05);      // tall: slightly wider ok
                else if (ceil < 24) workSp = Math.round(workSp * 0.85);  // low: tighter for floor coverage
              }
              // LOW end (destrat): both directions at max spacing
              const loCols = Math.max(1, Math.round(len/destratSp));
              const loRows = Math.max(1, Math.round(wid/destratSp));
              const lo = loCols * loRows;
              // HIGH end (working / dock coverage): tight along length, +1 row across width
              const hiCols = Math.max(1, Math.round(len/workSp));
              const hiRows = Math.max(1, Math.round(wid/destratSp) + 1);
              const hi = hiCols * hiRows;
              const area = Math.round(len*wid);
              return (
                <div style={{background:T.accentLt,border:`1.5px solid ${T.accentBd}`,borderRadius:12,padding:16,marginBottom:12}}>
                  <div style={{fontSize:11,fontWeight:800,letterSpacing:"0.06em",color:T.accent,marginBottom:4}}>
                    {area.toLocaleString()} SQ FT · {spaceDia}ft FANS · {isNaN(ceil)?"—":ceil+"ft"} CEILING
                  </div>
                  <div style={{textAlign:"center",margin:"6px 0 12px"}}>
                    <div style={{fontSize:11,color:T.textSub,fontWeight:700,marginBottom:2}}>ESTIMATED FAN COUNT</div>
                    <div style={{fontSize:40,fontWeight:900,color:T.accent,lineHeight:1}}>{lo}–{hi}</div>
                    <div style={{fontSize:11,color:T.textSub,marginTop:4}}>fans</div>
                  </div>
                  <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:10}}>
                    <div style={{background:"#fff",border:`1px solid ${T.border}`,borderRadius:8,padding:"10px",textAlign:"center"}}>
                      <div style={{fontSize:11,color:T.textSub,fontWeight:700,marginBottom:2}}>Destrat (low)</div>
                      <div style={{fontSize:22,fontWeight:900,color:T.green}}>{lo}</div>
                      <div style={{fontSize:10,color:T.textSub,marginTop:2}}>{loCols} × {loRows}, ~{destratSp}ft apart</div>
                    </div>
                    <div style={{background:"#fff",border:`1px solid ${T.border}`,borderRadius:8,padding:"10px",textAlign:"center"}}>
                      <div style={{fontSize:11,color:T.textSub,fontWeight:700,marginBottom:2}}>Working (high)</div>
                      <div style={{fontSize:22,fontWeight:900,color:T.accent}}>{hi}</div>
                      <div style={{fontSize:10,color:T.textSub,marginTop:2}}>{hiCols} × {hiRows}, ~{workSp}ft apart</div>
                    </div>
                  </div>
                  <div style={{fontSize:12,color:T.textMid,fontWeight:700,lineHeight:1.5}}>
                    💡 LOW = heat destratification (fewest fans, max spacing). HIGH = people-cooling with tighter rows along docks/work areas. Real jobs land in this range — your judgment on dock & work-zone locations decides where.
                  </div>
                </div>
              );
            })()}

            <div style={{fontSize:11,color:T.textSub,marginTop:6,lineHeight:1.6}}>
              ⚠ Planning estimate only — not a stamped layout. Ceiling height sets the max fan size and affects spacing. Real placement also depends on docks, obstructions, racking, heat sources, and sprinkler heads (NFPA requires fans centered between 4 sprinkler heads). For a binding layout, use the manufacturer's free CAD/Revit service. Spacing values from GFY Z-Tech published data.
            </div>
          </div>
        )}

        {/* ══════════════════════════════════════════════════════════
            TAB 9 — VFD PARAM CAPTURE
        ══════════════════════════════════════════════════════════ */}
        {tab===9 && (
          <div>
            {pcEditing ? (() => {
              const E = pcEditing; const sch = PC_SCHEMES[E.vfd];
              const set = (p) => setPcEditing({...E,...p});
              const setRow = (i,p) => { const rows=[...E.rows]; rows[i]={...rows[i],...p}; set({rows}); };
              const changeVfd = (v) => { const nb=pcBlank(v); setPcEditing({...nb,id:E.id,fanSize:E.fanSize,location:E.location,serial:E.serial,date:E.date}); };
              return (
                <div>
                  <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:14}}>
                    <div style={{fontWeight:900,fontSize:16,color:T.text,flex:1}}>Param Capture</div>
                    <button onClick={()=>setPcEditing(null)} style={{background:T.bg,border:`1.5px solid ${T.border}`,borderRadius:8,padding:"7px 12px",fontFamily:"'Nunito',sans-serif",fontWeight:800,fontSize:12,color:T.textSub,cursor:"pointer"}}>Cancel</button>
                  </div>
                  <div style={{background:T.surface,border:`1px solid ${T.border}`,borderRadius:12,padding:14,marginBottom:12}}>
                    <div style={{fontSize:11,fontWeight:800,color:T.textSub,letterSpacing:"0.06em",marginBottom:8}}>VFD TYPE</div>
                    <select value={E.vfd} onChange={e=>changeVfd(e.target.value)} style={{...INP(),cursor:"pointer"}}>
                      {Object.keys(PC_SCHEMES).map(k=><option key={k} value={k}>{k}</option>)}
                    </select>
                    <div style={{fontSize:10,color:T.textSub,marginTop:6}}>Source: {sch.src}</div>
                    {sch.locked && <div style={{background:T.yellowBg,border:`1px solid ${T.yellowBd}`,color:T.yellow,borderRadius:6,padding:"7px 9px",fontSize:11,fontWeight:700,marginTop:8,lineHeight:1.4}}>⚠ Factory-locked drive — record values only. Do NOT reprogram without manufacturer authorization.</div>}
                  </div>
                  <div style={{background:T.surface,border:`1px solid ${T.border}`,borderRadius:12,padding:14,marginBottom:12}}>
                    <div style={{fontSize:11,fontWeight:800,color:T.textSub,letterSpacing:"0.06em",marginBottom:8}}>FAN IDENTITY</div>
                    <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginBottom:8}}>
                      <input value={E.fanSize} onChange={e=>set({fanSize:e.target.value})} placeholder="Fan size (24ft Z-Tech)" style={INP()}/>
                      <input value={E.serial} onChange={e=>set({serial:e.target.value})} placeholder="Serial #" style={INP()}/>
                    </div>
                    <div style={{display:"grid",gridTemplateColumns:"2fr 1fr",gap:8}}>
                      <input value={E.location} onChange={e=>set({location:e.target.value})} placeholder="Location / site / fan #" style={INP()}/>
                      <input value={E.date} onChange={e=>set({date:e.target.value})} type="date" style={INP()}/>
                    </div>
                  </div>
                  <div style={{background:T.surface,border:`1px solid ${T.border}`,borderRadius:12,padding:14,marginBottom:12}}>
                    <div style={{fontSize:11,fontWeight:800,color:T.textSub,letterSpacing:"0.06em",marginBottom:8}}>PARAMETERS — read off the working drive</div>
                    <div style={{display:"flex",flexDirection:"column",gap:8}}>
                      {E.rows.map((r,i)=>(
                        <div key={i} style={{display:"grid",gridTemplateColumns:"82px 1fr 74px 26px",gap:6,alignItems:"center"}}>
                          <input value={r.p} onChange={e=>setRow(i,{p:e.target.value})} placeholder="P-08" style={INP({fontFamily:"monospace",fontWeight:700,padding:"8px"})}/>
                          <input value={r.label||""} onChange={e=>setRow(i,{label:e.target.value})} placeholder="name (optional)" style={INP({fontSize:12,padding:"8px",color:T.textSub})}/>
                          <input value={r.v} onChange={e=>setRow(i,{v:e.target.value})} placeholder="value" style={INP({padding:"8px"})}/>
                          <button onClick={()=>set({rows:E.rows.filter((_,j)=>j!==i)})} style={{background:"none",border:"none",color:T.textSub,fontSize:18,cursor:"pointer"}}>×</button>
                        </div>
                      ))}
                    </div>
                    <button onClick={()=>set({rows:[...E.rows,{p:"",label:"",v:""}]})} style={{marginTop:10,background:T.accentLt,border:`1.5px solid ${T.accentBd}`,borderRadius:8,padding:"8px 14px",color:T.accent,fontFamily:"'Nunito',sans-serif",fontWeight:800,fontSize:13,cursor:"pointer"}}>＋ Add custom row</button>
                  </div>
                  {sch.p36 && (
                    <div style={{background:T.surface,border:`1px solid ${T.border}`,borderRadius:12,padding:14,marginBottom:12}}>
                      <div style={{fontSize:11,fontWeight:800,color:T.textSub,letterSpacing:"0.06em",marginBottom:2}}>P-36 — ADDRESSING (3 indexes)</div>
                      <div style={{fontSize:10,color:T.textSub,marginBottom:8}}>Idx1 = address · Idx2 = baud · Idx3 = timeout</div>
                      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:8}}>
                        <input value={E.p36.idx1} onChange={e=>set({p36:{...E.p36,idx1:e.target.value}})} placeholder="Idx1" style={INP()}/>
                        <input value={E.p36.idx2} onChange={e=>set({p36:{...E.p36,idx2:e.target.value}})} placeholder="Idx2" style={INP()}/>
                        <input value={E.p36.idx3} onChange={e=>set({p36:{...E.p36,idx3:e.target.value}})} placeholder="Idx3" style={INP()}/>
                      </div>
                    </div>
                  )}
                  <div style={{display:"flex",gap:8}}>
                    <button onClick={pcSave} style={{flex:1,background:T.green,border:"none",borderRadius:8,padding:"12px",color:"#fff",fontFamily:"'Nunito',sans-serif",fontWeight:900,fontSize:14,cursor:"pointer"}}>Save to device</button>
                    <button onClick={()=>pcCopy(E)} style={{flex:1,background:T.accent,border:"none",borderRadius:8,padding:"12px",color:"#fff",fontFamily:"'Nunito',sans-serif",fontWeight:900,fontSize:14,cursor:"pointer"}}>{pcCopied?"Copied ✓":"Copy All"}</button>
                  </div>
                  <div style={{fontSize:11,color:T.textSub,marginTop:10,lineHeight:1.5}}>💡 "Copy All" is your real backup — paste into a note or text it. Pre-labeled params come from manufacturer docs; verify against your actual drive.</div>
                </div>
              );
            })() : (
              <div>
                <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:14}}>
                  <div style={{fontWeight:900,fontSize:16,color:T.text,flex:1}}>VFD Param Captures</div>
                  <button onClick={()=>setPcEditing(pcBlank("Invertek ODE-3"))} style={{background:T.green,border:"none",borderRadius:8,padding:"9px 14px",color:"#fff",fontFamily:"'Nunito',sans-serif",fontWeight:900,fontSize:13,cursor:"pointer"}}>＋ New Capture</button>
                </div>
                {pcList.length===0 ? (
                  <div style={{background:T.surface,border:`1px solid ${T.border}`,borderRadius:12,padding:"40px 20px",textAlign:"center",color:T.textSub,fontSize:14}}>No captures yet.<br/>Tap "＋ New Capture" to record a fan's VFD parameters.</div>
                ) : (
                  <div style={{display:"flex",flexDirection:"column",gap:8}}>
                    {pcList.map(c=>(
                      <div key={c.id} style={{background:T.surface,border:`1px solid ${T.border}`,borderRadius:10,padding:12}}>
                        <div style={{display:"flex",alignItems:"center",gap:8}}>
                          <div style={{flex:1}}>
                            <div style={{fontWeight:800,fontSize:14,color:T.text}}>{c.fanSize||"(no fan size)"} {c.location?("· "+c.location):""}</div>
                            <div style={{fontSize:11,color:T.textSub,marginTop:2}}>{c.vfd} · {c.serial||"no serial"} · {c.date}</div>
                          </div>
                          <button onClick={()=>setPcEditing(c)} style={{background:T.accentLt,border:`1.5px solid ${T.accentBd}`,borderRadius:6,padding:"6px 10px",color:T.accent,fontFamily:"'Nunito',sans-serif",fontWeight:800,fontSize:12,cursor:"pointer"}}>Open</button>
                          <button onClick={()=>pcCopy(c)} style={{background:T.bg,border:`1.5px solid ${T.border}`,borderRadius:6,padding:"6px 10px",color:T.textSub,fontFamily:"'Nunito',sans-serif",fontWeight:800,fontSize:12,cursor:"pointer"}}>Copy</button>
                          <button onClick={()=>pcDel(c.id)} style={{background:T.redBg,border:`1.5px solid #FCA5A5`,borderRadius:6,padding:"6px 10px",color:T.red,fontFamily:"'Nunito',sans-serif",fontWeight:800,fontSize:12,cursor:"pointer"}}>Del</button>
                        </div>
                      </div>
                    ))}
                  </div>
                )}
                <div style={{fontSize:11,color:T.textSub,marginTop:12,lineHeight:1.5}}>💡 Captures save on this device. The Copy button gives you a text backup to paste into a note or text to yourself — that's the backup that survives if your browser data clears.</div>
              </div>
            )}
          </div>
        )}

        {/* ══════════════════════════════════════════════════════════
            TAB 10 — BRAND PAGE (dark island view, per-manufacturer)
        ══════════════════════════════════════════════════════════ */}
        {tab===10 && (
          <BrandPage
            brandKey={brand}
            brandData={brand ? brands[brand] : null}
            theme={brand ? BRAND_THEMES[brand] : null}
            onBack={()=>setTab(0)}
            onJumpToFanSetup={()=>setTab(0)}
          />
        )}
      </div>
      {showSettings && (
        <SettingsPanel
          brands={brands}
          onSave={saveData}
          onClose={()=>setShowSettings(false)}
          onReset={()=>{ saveData(JSON.parse(JSON.stringify(DEFAULT_BRANDS))); }}
        />
      )}

      <style>{`
        @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap');
        @keyframes fanSpin { to { transform: rotate(360deg); } }
        @keyframes bounce { 0%,100%{transform:translateY(0);opacity:0.4} 50%{transform:translateY(-5px);opacity:1} }
        select option { background:#fff; color:#111; }
        button:active { transform: scale(0.98); }
        ::-webkit-scrollbar { width:5px; }
        ::-webkit-scrollbar-track { background:#F3F4F6; }
        ::-webkit-scrollbar-thumb { background:#D1D5DB; border-radius:4px; }
        textarea { font-family: 'Nunito', sans-serif; }
      `}</style>
    </div>
  );
}


    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(React.createElement(App));
    document.getElementById('loading').style.display = 'none';
    document.getElementById('root').style.display = 'block';
  </script>
</body>
</html>
