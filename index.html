        steps:["Check communication link between drive and external devices","Make sure each drive on the network has its own unique address (P-36)","Check RS485 wiring: Terminal 3 (blue), Terminal 7 (white/orange), Terminal 8 (orange)","Verify termination resistor is enabled at last device on bus","Confirm baud rate settings match between drive and controller"] },
      { code:"13", display:"FLt-dc", sev:"high", label:"DC Bus Ripple Too High",
        cause:"Excessive ripple on DC bus — typically caused by missing or unbalanced input phases.",
        steps:["Check incoming supply phases are all present and balanced","Measure L1, L2, L3 at drive input — all must be present","Check main fuses — one blown = phase loss causing ripple","Inspect contactor contacts for damage"] },
      { code:"14", display:"P-LOSS", sev:"high", label:"Input Phase Loss Trip",
        cause:"One or more incoming power supply phases are missing or severely unbalanced.",
        steps:["Check incoming power supply phases are present and balanced","Measure all 3 phases at drive input under load","Check main fuses — one blown fuse = phase loss","Inspect contactor contacts for pitting or welding","Verify 3-phase supply at panel feeding the drive"] },
      { code:"15", display:"h O-I",  sev:"crit", label:"Output Overcurrent (Hardware Trip)",
        cause:"Hardware-level short circuit detected on motor output. NOTE: Drive cannot be immediately reset — mandatory delay is inbuilt to allow power components to recover.",
        steps:["⚠ LOTO immediately — do not restart until cause is found","⚠ Wait for mandatory reset delay — do not repeatedly attempt to reset","Check for short circuits on the motor and connection cable — megger test all phases","Disconnect motor leads at drive and megger test: phase-to-phase and phase-to-ground (must be >1MΩ)","Inspect conduit and cable for crushed or abraded insulation","If drive trips with motor disconnected: drive power stage is failed — replace drive"] },
      { code:"16", display:"Eh-FLt", sev:"med",  label:"Faulty Thermistor on Heatsink",
        cause:"Heatsink temperature sensor (thermistor) has failed or is reading incorrectly.",
        steps:["Power cycle drive — thermistor may have recovered","If persistent: drive control board thermistor circuit is faulty","Contact Invertek support or replace drive"] },
      { code:"17", display:"dAtA-F", sev:"med",  label:"Internal Memory Fault (IO)",
        cause:"Internal IO memory fault detected.",
        steps:["Press the STOP key to attempt recovery","If fault persists: contact your supplier or Invertek support","Drive may need to be returned for repair or replacement"] },
      { code:"18", display:"4-20 F", sev:"med",  label:"4–20mA Signal Lost",
        cause:"4–20mA analog input signal has been lost — signal dropped below 4mA threshold.",
        steps:["Check the analog input connection(s) at drive terminals","Verify 4–20mA signal source is active and wired correctly","Check for broken wire or loose terminal on analog input","Verify signal is present: should read 4mA at 0% speed, 20mA at 100%","Check P-16 analog input configuration matches signal type"] },
      { code:"19", display:"dAtA-E", sev:"med",  label:"Internal Memory Fault (DSP)",

      { code:"21", display:"F-Ptc",  sev:"med",  label:"Motor PTC Thermistor Trip",
        cause:"Connected motor thermistor is indicating motor over temperature.",
        steps:["Check motor winding temperature — motor may be genuinely overheating","Check wiring connections at PTC thermistor terminals","Verify motor thermistor resistance is within normal operating range","Allow motor to cool before restarting","If no thermistor fitted: check P-15 thermistor input setting"] },
      { code:"22", display:"FAn-F",  sev:"med",  label:"Cooling Fan Fault (IP66 drives only)",
        cause:"Drive internal cooling fan has failed — applies to IP66 rated drives only.",
        steps:["Check and replace the drive cooling fan","Verify fan wiring and connector are secure","Do not operate drive without cooling fan — drive will overheat","Contact supplier for replacement fan part number"] },
      { code:"23", display:"O-hEAt", sev:"med",  label:"Drive Internal Temperature Too High",

      { code:"26", display:"OUt-F",  sev:"high", label:"Output Fault",

      { code:"41", display:"AtF-02", sev:"med",  label:"Autotune Fault",
        cause:"Motor parameters measured during autotune are not correct. Motor cable or connection issue.",
        steps:["Check motor cable and all connections for continuity","Verify all three phases of motor are present and balanced","Check P-07 (motor voltage), P-08 (motor FLA), P-09 (motor frequency) are correct before autotune","Ensure motor is at standstill and unloaded before running autotune","Try static autotune if rotating autotune fails"] },
      { code:"50", display:"SC-F01", sev:"med",  label:"Modbus Communications Loss Fault",

// ─────────────────────────────────────────────────────────────────────────────
// MOTOR RESOLVER — looks up motor specs from model or diameter
// ─────────────────────────────────────────────────────────────────────────────
// Z-Tech spec sheet confirmed: ALL fans 8–24ft use 2 HP motor.
// FLA @ 480V: 2.65A (8–14ft), 3.5A (16–24ft). Use model lookup — these are fallback estimates only.
const DIA_HP  = {6:0.5,8:2.0,10:2.0,12:2.0,14:2.0,16:2.0,18:2.0,20:2.0,22:2.0,24:2.0};
// FLA @ 460V per diameter (Z-Tech verified values used as fallback)
const DIA_FLA460 = {6:1.6,8:2.65,10:2.65,12:2.65,14:2.65,16:3.5,18:3.5,20:3.5,22:3.5,24:3.5};
// HP → FLA @ 460V 3-phase, per NEC Table 430.250 (fallback estimate only — model data is authoritative)
const HP_FLA  = {0.5:1.0, 0.75:1.4, 1.0:2.1, 1.5:3.0, 2.0:3.4, 3.0:4.8, 5.0:7.6};

function resolveMotor(bdata, modelName, diameter, voltage) {
  const v = parseInt(voltage) || 460;
  if (bdata?.usesDiameter && diameter) {
    const d = parseInt(diameter);
    const s = bdata.diameterSpecs?.[d];
    if (s) {
      const fla = v >= 400 ? s.fla460 : s.fla460 * 2.0; // 460V→230V ≈ 2.0× (inverse voltage)
      return { hp:s.hp, fla, circuit:s.circuit, frame:s.frame, source:"diameter" };
    }
  }
  if (modelName && bdata?.models) {
    const m = bdata.models.find(x => x.name === modelName);
    if (m?.hp) {
      const fla = v >= 400 ? (m.fla460 || null) : (m.fla230 || null);
      return { hp:m.hp, fla:fla||0, circuit:m.circuit||"—", frame:m.frame||"—", source:"model", note:m.note };
    }
  }
  if (diameter) {
    const d = parseInt(diameter);
    if (DIA_HP[d]) {
      const hp = DIA_HP[d];
      const fla460 = DIA_FLA460[d] || HP_FLA[hp] || 3.5;
      const fla = v >= 400 ? fla460 : fla460 * 2.0; // 460V→230V: current scales inversely with voltage (≈2.0×)
      return { hp, fla: parseFloat(fla.toFixed(2)), circuit:"10A", frame:"143TC", source:"estimated" };
    }
  }
  return null;
}

    steps:["Measure L1–L2, L2–L3, L1–L3 at VFD input under load","Average voltage: (V1+V2+V3) ÷ 3","% Imbalance = (|Vmax – Vavg| ÷ Vavg) × 100","<2%: acceptable | 2–5%: investigate | >5%: do not operate — motor will overheat","Common causes: loose terminal, blown fuse, utility supply imbalance"] },
  { label:"Motor Winding Resistance (phase-to-phase)", spec:"All 3 readings equal within 5%", tool:"Ohmmeter",
    steps:["⚠ LOTO required — disconnect motor leads at VFD output before testing","Set DMM to lowest Ohms range","Measure T1–T2, T2–T3, T1–T3 at motor leads — record all three","Values must be equal within 5% across all three measurements","Typical HVLS motor: 2–15Ω per phase depending on HP","Any phase <0.5Ω = shorted winding → REPLACE MOTOR | Open reading = broken winding"] },
  { label:"Insulation Resistance to Ground (Megger)", spec:">1 MΩ at 500VDC", tool:"Megohmmeter 500VDC",
    steps:["⚠ LOTO + wait 5 min for VFD capacitors to fully discharge before testing","Disconnect motor leads at BOTH VFD output AND motor junction box","Short T1, T2, T3 together at motor junction box","Apply 500VDC test: red probe to shorted leads, black to motor frame/PE","Read at 60 seconds: >100 MΩ=excellent | >1 MΩ=acceptable | <100 kΩ=FAIL","⚠ Discharge leads to ground before disconnecting probes — megger charges windings"] },
  { label:"VFD Output Voltage (Running)", spec:"Balanced ±2% across U/V/W", tool:"True RMS DMM",
    steps:["⚠ MUST use True RMS DMM — VFD output is PWM, standard DMM gives wrong readings","Fan must be running at stable speed during measurement","Measure U–V, V–W, U–W at VFD output terminals — record all three","At 60Hz/460V drive: expect ~460V | At 45Hz: expect ~345V (proportional to Hz)","Large imbalance between phases at output = faulty VFD output power stage"] },
  { label:"Motor Amps — All 3 Phases", spec:"<100% of motor nameplate FLA", tool:"True RMS Clamp Meter",
    steps:["Fan must be running at full operating speed","Clamp around ONE conductor at a time — never multiple wires simultaneously","Clamp U phase → record. Repeat for V and W phases separately","All readings must be below motor nameplate FLA","Phase imbalance >10% = investigate winding resistance on that phase","All phases high = check blade condition, gearbox binding, or over-speed setting"] },
  { label:"Voltage Drop — Panel to VFD", spec:"<3% of supply voltage", tool:"True RMS DMM",
    steps:["Measure voltage AT panel breaker output under running load — record","Measure voltage AT VFD input terminals under same load — record","% Drop = (V-panel – V-vfd) ÷ V-panel × 100","If >3%: wire is undersized for the run length — upsize or shorten run","Z-Tech minimum: 12 AWG stranded. Long runs may need 10 AWG or larger"] },
  { label:"Ground Continuity", spec:"<1Ω — motor frame to panel ground", tool:"Ohmmeter",
    steps:["⚠ LOTO required before testing","Touch probe to motor frame (bare metal — not painted surface)","Touch other probe to panel ground bar","Must read <1Ω — ideally 0.1–0.5Ω","High reading: check ground wire at motor box, VFD PE terminal, and panel ground bar","Z-Tech spec: separate insulated ground conductor from panel to each individual VFD"] },
  { label:"Control Signal (Analog Input)", spec:"0–10V or 4–20mA tracks commanded speed %", tool:"DMM — DC Volts",
    steps:["Set DMM to DC Volts mode","Identify analog input terminals on VFD (typically AIN+ and COM/GND)","Command 0% speed → should read 0V (or 4mA for 4–20mA systems)","Command 50% speed → should read 5V (or 12mA)","Command 100% speed → should read 10V (or 20mA)","Control signal wiring MUST run in separate conduit from all power cables"] },
  { label:"Output Cable Insulation (VFD to Motor)", spec:">1 MΩ phase-to-ground", tool:"Megohmmeter 500VDC",
    steps:["⚠ LOTO + disconnect cable at BOTH VFD output AND motor terminal box","Test each conductor to conduit/ground: U→GND, V→GND, W→GND","Also test phase-to-phase: U→V, V→W, U→W","All readings must be >1 MΩ","<1 MΩ: cable damaged — inspect conduit run for crush points or sharp bends","Z-Tech spec: stranded wire ONLY on VFD output — solid wire will fail over time"] },
  { label:"Terminal Torque Verification", spec:"Blades: 30 ft-lbs ±2 | Mount hardware: 40 ft-lbs min", tool:"Calibrated Torque Wrench",
    steps:["⚠ LOTO required before touching any hardware","VFD power lugs: torque per manufacturer spec (typically 4–6 N·m for 10–14 AWG)","Z-Tech blade hardware: 30 ft-lbs ±2 ft-lbs — verify after first 200 hours","Z-Tech mount hardware (upper/lower yoke): 40 ft-lbs minimum","Wire discoloration at terminals = high resistance → re-torque or replace terminal lug","Guy wire cable clamps: 4.5 ft-lbs minimum"] },
];

// SETTINGS PANEL — edit brands, models, faults, field notes
// ─────────────────────────────────────────────────────────────────────────────
function SettingsPanel({ brands, onSave, onClose, onReset }) {
  const [settingsTab, setSettingsTab] = useState("brands");
  const [activeBrand, setActiveBrand] = useState(Object.keys(brands)[0]);
  const [edited, setEdited] = useState(JSON.parse(JSON.stringify(brands)));
  const [newBrandName, setNewBrandName] = useState("");
  const [expandedFault, setExpandedFault] = useState(null);
  const [expandedNote, setExpandedNote] = useState(null);
  const [expandedModel, setExpandedModel] = useState(null);
  // Password protection for params tab
  const [paramPassword, setParamPassword] = useState("");
  const [paramUnlocked, setParamUnlocked] = useState(false);
  const [paramError, setParamError] = useState(false);
  // Video editing state
  const [expandedVideo, setExpandedVideo] = useState(null);

  const b = edited[activeBrand] || {};

  const updateBrandField = (field, value) => {
    setEdited(p => ({ ...p, [activeBrand]: { ...p[activeBrand], [field]: value } }));
  };

  const updateModel = (i, field, value) => {
    const models = [...(b.models||[])];
    models[i] = { ...models[i], [field]: field==="name"||field==="note"||field==="frame"||field==="circuit" ? value : (value===""?null:parseFloat(value)) };
    updateBrandField("models", models);
  };

  const addModel = () => {
    const models = [...(b.models||[]), { name:"New Model", hp:1.5, fla460:4.0, fla230:8.0, circuit:"10A", frame:"145TC", rpm:1750 }];
    updateBrandField("models", models);
    setExpandedModel(models.length-1);
  };

  const removeModel = (i) => {
    const models = (b.models||[]).filter((_,idx)=>idx!==i);
    updateBrandField("models", models);
    setExpandedModel(null);
  };

  const updateFault = (i, field, value) => {
    const faults = [...(b.faults||[])];
    if (field === "steps") {
      faults[i] = { ...faults[i], steps: value.split("\n").filter(s=>s.trim()) };
    } else {
      faults[i] = { ...faults[i], [field]: value };
    }
    updateBrandField("faults", faults);
  };

  const addFault = () => {
    const faults = [...(b.faults||[]), { code:"NEW", display:"NEW", sev:"med", label:"New Fault", cause:"Describe cause here.", steps:["Step 1","Step 2"] }];
    updateBrandField("faults", faults);
    setExpandedFault(faults.length-1);
  };

  const removeFault = (i) => {
    updateBrandField("faults", (b.faults||[]).filter((_,idx)=>idx!==i));
    setExpandedFault(null);
  };

  const updateNote = (i, field, value) => {
    const notes = [...(b.fieldNotes||[])];
    notes[i] = { ...notes[i], [field]: value };
    updateBrandField("fieldNotes", notes);
  };

  const updateNoteStep = (ni, si, field, value) => {
    const notes = [...(b.fieldNotes||[])];
    const steps = [...(notes[ni].steps||[])];
    steps[si] = { ...steps[si], [field]: value };
    notes[ni] = { ...notes[ni], steps };
    updateBrandField("fieldNotes", notes);
  };

  const addNoteStep = (ni) => {
    const notes = [...(b.fieldNotes||[])];
    notes[ni] = { ...notes[ni], steps:[...(notes[ni].steps||[]), { param:"Param", value:"Value", note:"Description" }] };
    updateBrandField("fieldNotes", notes);
  };

  const removeNoteStep = (ni, si) => {
    const notes = [...(b.fieldNotes||[])];
    notes[ni] = { ...notes[ni], steps: notes[ni].steps.filter((_,idx)=>idx!==si) };
    updateBrandField("fieldNotes", notes);
  };

  const addBrand = () => {
    if (!newBrandName.trim()) return;
    setEdited(p => ({
      ...p,
      [newBrandName]: {
        vfd:"New VFD Type", paramType:"invertek", phone:"1-800-000-0000",
        note:"Enter brand description here.", warningNote:"", website:"",
        usesDiameter:false, manualLinks:[], models:[], faults:[], fieldNotes:[],
      }
    }));
    setActiveBrand(newBrandName);
    setNewBrandName("");
  };

  const removeBrand = (name) => {
    if (!confirm(`Remove "${name}"? This cannot be undone.`)) return;
    const copy = { ...edited };
    delete copy[name];
    setEdited(copy);
    setActiveBrand(Object.keys(copy)[0] || "");
  };

  const sectionBtn = (key, label) => (
    <button onClick={()=>setSettingsTab(key)}
      style={{padding:"7px 14px",background:settingsTab===key?T.accent:T.surface,border:`1.5px solid ${settingsTab===key?T.accent:T.border}`,borderRadius:20,color:settingsTab===key?"#fff":T.textSub,fontFamily:"'Nunito',sans-serif",fontSize:11,fontWeight:800,cursor:"pointer"}}>
      {label}
    </button>
  );

  return (
    <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.65)",zIndex:1000,display:"flex",alignItems:"flex-start",justifyContent:"center",overflowY:"auto",padding:"20px 10px"}}>
      <div style={{background:T.surface,borderRadius:16,width:"100%",maxWidth:700,boxShadow:"0 20px 60px rgba(0,0,0,0.4)"}}>
        {/* Header */}
        <div style={{background:"#111",borderRadius:"16px 16px 0 0",padding:"16px 20px",display:"flex",alignItems:"center",justifyContent:"space-between"}}>
          <div style={{color:"#fff",fontWeight:900,fontSize:16}}>⚙ Settings</div>
          <div style={{display:"flex",gap:8}}>
            <button onClick={()=>{ if(confirm("Reset ALL data to factory defaults? This cannot be undone.")) onReset(); }}
              style={{padding:"6px 14px",background:"#B91C1C",border:"none",borderRadius:6,color:"#fff",fontFamily:"'Nunito',sans-serif",fontWeight:800,fontSize:12,cursor:"pointer"}}>Reset to Default</button>
            <button onClick={()=>onSave(edited)}
              style={{padding:"6px 14px",background:T.green,border:"none",borderRadius:6,color:"#fff",fontFamily:"'Nunito',sans-serif",fontWeight:800,fontSize:12,cursor:"pointer"}}>💾 Save</button>
            <button onClick={onClose}
              style={{padding:"6px 14px",background:"#444",border:"none",borderRadius:6,color:"#fff",fontFamily:"'Nunito',sans-serif",fontWeight:800,fontSize:12,cursor:"pointer"}}>✕ Close</button>
          </div>
        </div>

        <div style={{padding:16}}>
          {/* Section tabs */}
          <div style={{display:"flex",gap:6,flexWrap:"wrap",marginBottom:16}}>
            {sectionBtn("brands","🏭 Brands")}
            {sectionBtn("info","📋 Brand Info")}
            {sectionBtn("models","🔧 Models")}
            {sectionBtn("faults","⚠ Fault Codes")}
            {sectionBtn("notes","📝 Field Notes")}
            {sectionBtn("params","🔐 Parameters")}
            {sectionBtn("videos","📺 Videos")}
          </div>

          {/* BRANDS tab */}
          {settingsTab==="brands" && <div>
            <div style={{fontWeight:800,fontSize:14,color:T.text,marginBottom:12}}>Active Manufacturers</div>
            {Object.keys(edited).map(name => (
              <div key={name} style={{display:"flex",alignItems:"center",gap:8,padding:"10px 12px",background:activeBrand===name?T.accentLt:T.bg,border:`1.5px solid ${activeBrand===name?T.accent:T.border}`,borderRadius:8,marginBottom:6}}>
                <button onClick={()=>{setActiveBrand(name);setSettingsTab("info");}}
                  style={{flex:1,textAlign:"left",background:"none",border:"none",cursor:"pointer",fontFamily:"'Nunito',sans-serif",fontWeight:activeBrand===name?800:600,fontSize:13,color:activeBrand===name?T.accent:T.text}}>
                  {name}
                  <span style={{fontSize:11,color:T.textSub,marginLeft:8}}>{edited[name].vfd}</span>
                </button>
                <button onClick={()=>removeBrand(name)}
                  style={{padding:"4px 10px",background:T.redBg,border:`1px solid ${T.redBd}`,borderRadius:6,color:T.red,fontFamily:"'Nunito',sans-serif",fontSize:11,fontWeight:800,cursor:"pointer"}}>Remove</button>
              </div>
            ))}
            <div style={{marginTop:16,padding:"12px",background:T.greenBg,border:`1px solid ${T.greenBd}`,borderRadius:10}}>
              <div style={{fontWeight:800,fontSize:13,color:T.green,marginBottom:8}}>➕ Add New Manufacturer</div>
              <div style={{display:"flex",gap:8}}>
                <input value={newBrandName} onChange={e=>setNewBrandName(e.target.value)} placeholder="e.g. MacroAir" style={{...SINP(),flex:1}}/>
                <button onClick={addBrand} style={{padding:"7px 16px",background:T.green,border:"none",borderRadius:6,color:"#fff",fontFamily:"'Nunito',sans-serif",fontWeight:800,fontSize:12,cursor:"pointer"}}>Add</button>
              </div>
              <div style={{fontSize:11,color:T.textSub,marginTop:6}}>After adding, go to Brand Info, Models, Faults, and Field Notes to fill in all details.</div>
            </div>
          </div>}

          {/* Brand selector for other tabs */}
          {settingsTab!=="brands" && (
            <div style={{marginBottom:14}}>
              <label style={{fontSize:11,fontWeight:800,color:T.textSub,display:"block",marginBottom:4}}>EDITING BRAND</label>
              <select value={activeBrand} onChange={e=>setActiveBrand(e.target.value)} style={{...SINP(),cursor:"pointer"}}>
                {Object.keys(edited).map(n=><option key={n}>{n}</option>)}
              </select>
            </div>
          )}

          {/* BRAND INFO tab */}
          {settingsTab==="info" && b && <div>
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:10}}>
              {[["VFD Type","vfd"],["Phone","phone"],["Website","website"],["Parameter Type","paramType"]].map(([label,field])=>(
                <div key={field}>
                  <label style={{fontSize:11,fontWeight:700,color:T.textSub,display:"block",marginBottom:4}}>{label.toUpperCase()}</label>
                  <input value={b[field]||""} onChange={e=>updateBrandField(field,e.target.value)} style={SINP()}/>
                </div>
              ))}
            </div>
            <div style={{marginBottom:10}}>
              <label style={{fontSize:11,fontWeight:700,color:T.textSub,display:"block",marginBottom:4}}>BRAND DESCRIPTION / NOTE</label>
              <textarea value={b.note||""} onChange={e=>updateBrandField("note",e.target.value)} rows={3} style={{...SINP(),resize:"vertical"}}/>
            </div>
            <div style={{marginBottom:10}}>
              <label style={{fontSize:11,fontWeight:700,color:T.textSub,display:"block",marginBottom:4}}>WARNING NOTE (shown in orange — leave blank if none)</label>
              <textarea value={b.warningNote||""} onChange={e=>updateBrandField("warningNote",e.target.value)} rows={2} style={{...SINP(),resize:"vertical"}}/>
            </div>
            <div style={{marginBottom:4}}>
              <label style={{fontSize:11,fontWeight:700,color:T.textSub,display:"block",marginBottom:4}}>USES DIAMETER INPUT (instead of model dropdown)</label>
              <select value={b.usesDiameter?"yes":"no"} onChange={e=>updateBrandField("usesDiameter",e.target.value==="yes")} style={{...SINP(),cursor:"pointer"}}>
                <option value="no">No — use model dropdown</option>
                <option value="yes">Yes — use diameter number input</option>
              </select>
            </div>
            <div style={{marginTop:14}}>
              <div style={{fontWeight:800,fontSize:13,color:T.text,marginBottom:8}}>Manual Links</div>
              {(b.manualLinks||[]).map((link,i)=>(
                <div key={i} style={{display:"flex",gap:6,marginBottom:6,alignItems:"center"}}>
                  <input value={link.label} onChange={e=>{const ml=[...b.manualLinks];ml[i]={...ml[i],label:e.target.value};updateBrandField("manualLinks",ml);}} placeholder="Label" style={{...SINP(),flex:"0 0 140px"}}/>
                  <input value={link.url} onChange={e=>{const ml=[...b.manualLinks];ml[i]={...ml[i],url:e.target.value};updateBrandField("manualLinks",ml);}} placeholder="URL" style={{...SINP(),flex:1}}/>
                  <button onClick={()=>updateBrandField("manualLinks",(b.manualLinks||[]).filter((_,idx)=>idx!==i))} style={{padding:"6px 10px",background:T.redBg,border:`1px solid ${T.redBd}`,borderRadius:6,color:T.red,fontFamily:"'Nunito',sans-serif",fontWeight:800,fontSize:12,cursor:"pointer"}}>✕</button>
                </div>
              ))}
              <button onClick={()=>updateBrandField("manualLinks",[...(b.manualLinks||[]),{label:"",url:""}])}
                style={{padding:"6px 14px",background:T.accentLt,border:`1px solid ${T.accentBd}`,borderRadius:6,color:T.accent,fontFamily:"'Nunito',sans-serif",fontWeight:800,fontSize:12,cursor:"pointer"}}>+ Add Link</button>
            </div>
          </div>}

          {/* MODELS tab */}
          {settingsTab==="models" && b && <div>
            <div style={{fontSize:12,color:T.textSub,marginBottom:12}}>Edit model names and motor specs. FLA values in Amps. Leave fla460 or fla230 blank if not applicable.</div>
            {(b.models||[]).map((m,i)=>(
              <div key={i} style={{border:`1.5px solid ${expandedModel===i?T.accent:T.border}`,borderRadius:10,marginBottom:8,overflow:"hidden"}}>
                <div style={{display:"flex",alignItems:"center",gap:8,padding:"10px 12px",background:expandedModel===i?T.accentLt:T.bg,cursor:"pointer"}} onClick={()=>setExpandedModel(expandedModel===i?null:i)}>
                  <span style={{flex:1,fontWeight:700,fontSize:13,color:T.text}}>{m.name}</span>
                  <span style={{fontSize:12,color:T.textSub}}>{m.hp}HP · {m.circuit}</span>
                  <button onClick={e=>{e.stopPropagation();removeModel(i);}} style={{padding:"3px 8px",background:T.redBg,border:`1px solid ${T.redBd}`,borderRadius:4,color:T.red,fontFamily:"'Nunito',sans-serif",fontWeight:800,fontSize:11,cursor:"pointer"}}>Remove</button>
                </div>
                {expandedModel===i && (
                  <div style={{padding:12,display:"grid",gridTemplateColumns:"1fr 1fr",gap:8}}>
                    {[["Model Name","name","text"],["Circuit Size","circuit","text"],["HP","hp","number"],["FLA @ 460V","fla460","number"],["FLA @ 230V","fla230","number"],["RPM","rpm","number"],["NEMA Frame","frame","text"],["Note (optional)","note","text"]].map(([label,field,type])=>(
                      <div key={field}>
                        <label style={{fontSize:10,fontWeight:700,color:T.textSub,display:"block",marginBottom:3}}>{label}</label>
                        <input type={type} value={m[field]||""} onChange={e=>updateModel(i,field,e.target.value)} style={SINP()}/>
                      </div>
                    ))}
                  </div>
                )}
              </div>
            ))}
            <button onClick={addModel} style={{width:"100%",padding:"10px",background:T.greenBg,border:`1.5px solid ${T.greenBd}`,borderRadius:8,color:T.green,fontFamily:"'Nunito',sans-serif",fontWeight:800,fontSize:13,cursor:"pointer"}}>+ Add Model</button>
          </div>}

          {/* FAULTS tab */}
          {settingsTab==="faults" && b && <div>
            <div style={{fontSize:12,color:T.textSub,marginBottom:12}}>Edit fault codes, severity, and diagnostic steps. One step per line in the steps field.</div>
            {(b.faults||[]).map((f,i)=>(
              <div key={i} style={{border:`1.5px solid ${expandedFault===i?T.orange:T.border}`,borderRadius:10,marginBottom:8,overflow:"hidden"}}>
                <div style={{display:"flex",alignItems:"center",gap:8,padding:"10px 12px",background:expandedFault===i?T.orangeBg:T.bg,cursor:"pointer"}} onClick={()=>setExpandedFault(expandedFault===i?null:i)}>
                  <span style={{fontFamily:"monospace",fontWeight:900,fontSize:12,color:T.orange,minWidth:50}}>{f.display}</span>
                  <span style={{flex:1,fontSize:12,color:T.textMid}}>{f.label}</span>
                  <SevBadge sev={f.sev}/>
                  <button onClick={e=>{e.stopPropagation();removeFault(i);}} style={{padding:"3px 8px",background:T.redBg,border:`1px solid ${T.redBd}`,borderRadius:4,color:T.red,fontFamily:"'Nunito',sans-serif",fontWeight:800,fontSize:11,cursor:"pointer"}}>Remove</button>
                </div>
                {expandedFault===i && (
                  <div style={{padding:12}}>
                    <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:8,marginBottom:8}}>
                      {[["Code (internal)","code"],["Display Code","display"],["Short Label","label"]].map(([label,field])=>(
                        <div key={field}>
                          <label style={{fontSize:10,fontWeight:700,color:T.textSub,display:"block",marginBottom:3}}>{label}</label>
                          <input value={f[field]||""} onChange={e=>updateFault(i,field,e.target.value)} style={SINP()}/>
                        </div>
                      ))}
                    </div>
                    <div style={{marginBottom:8}}>
                      <label style={{fontSize:10,fontWeight:700,color:T.textSub,display:"block",marginBottom:3}}>SEVERITY</label>
                      <select value={f.sev} onChange={e=>updateFault(i,"sev",e.target.value)} style={{...SINP(),cursor:"pointer"}}>
                        <option value="crit">CRITICAL</option><option value="high">HIGH</option><option value="med">MEDIUM</option>
                      </select>
                    </div>
                    <div style={{marginBottom:8}}>
                      <label style={{fontSize:10,fontWeight:700,color:T.textSub,display:"block",marginBottom:3}}>ROOT CAUSE</label>
                      <textarea value={f.cause||""} onChange={e=>updateFault(i,"cause",e.target.value)} rows={2} style={{...SINP(),resize:"vertical"}}/>
                    </div>
                    <div>
                      <label style={{fontSize:10,fontWeight:700,color:T.textSub,display:"block",marginBottom:3}}>DIAGNOSTIC STEPS (one per line)</label>
                      <textarea value={(f.steps||[]).join("\n")} onChange={e=>updateFault(i,"steps",e.target.value)} rows={5} style={{...SINP(),resize:"vertical"}}/>
                    </div>
                  </div>
                )}
              </div>
            ))}
            <button onClick={addFault} style={{width:"100%",padding:"10px",background:T.yellowBg,border:`1.5px solid ${T.yellowBd}`,borderRadius:8,color:T.yellow,fontFamily:"'Nunito',sans-serif",fontWeight:800,fontSize:13,cursor:"pointer"}}>+ Add Fault Code</button>
          </div>}

          {/* FIELD NOTES tab */}
          {settingsTab==="notes" && b && <div>
            <div style={{fontSize:12,color:T.textSub,marginBottom:12}}>Edit field notes sections, procedure steps, and footer text.</div>
            {(b.fieldNotes||[]).map((n,ni)=>(
              <div key={ni} style={{border:`1.5px solid ${expandedNote===ni?T.accent:T.border}`,borderRadius:10,marginBottom:8,overflow:"hidden"}}>
                <div style={{display:"flex",alignItems:"center",gap:8,padding:"10px 12px",background:expandedNote===ni?T.accentLt:T.bg,cursor:"pointer"}} onClick={()=>setExpandedNote(expandedNote===ni?null:ni)}>
                  <span style={{flex:1,fontWeight:700,fontSize:13,color:T.text}}>{n.title}</span>
                  <span style={{fontSize:11,color:T.textSub}}>{n.steps?.length||0} steps</span>
                </div>
                {expandedNote===ni && (
                  <div style={{padding:12}}>
                    <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginBottom:10}}>
                      <div>
                        <label style={{fontSize:10,fontWeight:700,color:T.textSub,display:"block",marginBottom:3}}>TITLE</label>
                        <input value={n.title||""} onChange={e=>updateNote(ni,"title",e.target.value)} style={SINP()}/>
                      </div>
                      <div>
                        <label style={{fontSize:10,fontWeight:700,color:T.textSub,display:"block",marginBottom:3}}>COLOR</label>
                        <select value={n.color||"blue"} onChange={e=>updateNote(ni,"color",e.target.value)} style={{...SINP(),cursor:"pointer"}}>
                          <option value="blue">Blue</option><option value="red">Red</option><option value="green">Green</option><option value="purple">Purple</option>
                        </select>
                      </div>
                    </div>
                    <div style={{fontWeight:700,fontSize:12,color:T.textMid,marginBottom:6}}>Steps</div>
                    {(n.steps||[]).map((s,si)=>(
                      <div key={si} style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr auto",gap:6,marginBottom:6,alignItems:"center"}}>
                        <input value={s.param||""} onChange={e=>updateNoteStep(ni,si,"param",e.target.value)} placeholder="Param" style={SINP()}/>
                        <input value={s.value||""} onChange={e=>updateNoteStep(ni,si,"value",e.target.value)} placeholder="Value" style={SINP()}/>
                        <input value={s.note||""} onChange={e=>updateNoteStep(ni,si,"note",e.target.value)} placeholder="Note/description" style={SINP()}/>
                        <button onClick={()=>removeNoteStep(ni,si)} style={{padding:"6px 8px",background:T.redBg,border:`1px solid ${T.redBd}`,borderRadius:4,color:T.red,fontFamily:"'Nunito',sans-serif",fontWeight:800,cursor:"pointer"}}>✕</button>
                      </div>
                    ))}
                    <button onClick={()=>addNoteStep(ni)} style={{padding:"5px 12px",background:T.accentLt,border:`1px solid ${T.accentBd}`,borderRadius:6,color:T.accent,fontFamily:"'Nunito',sans-serif",fontWeight:700,fontSize:11,cursor:"pointer",marginBottom:10}}>+ Add Step</button>
                    <div>
                      <label style={{fontSize:10,fontWeight:700,color:T.textSub,display:"block",marginBottom:3}}>FOOTER NOTE (optional)</label>
                      <textarea value={n.footer||""} onChange={e=>updateNote(ni,"footer",e.target.value)} rows={2} style={{...SINP(),resize:"vertical"}}/>
                    </div>
                  </div>
                )}
              </div>
            ))}
          </div>}

          {/* PARAMETERS tab — password protected */}
          {settingsTab==="params" && <div>
            {!paramUnlocked ? (
              <div style={{textAlign:"center",padding:"20px 0"}}>
                <div style={{fontSize:40,marginBottom:12}}>🔐</div>
                <div style={{fontWeight:900,fontSize:15,color:T.text,marginBottom:4}}>Parameter Editor</div>
                <div style={{fontSize:12,color:T.textSub,marginBottom:20,lineHeight:1.6}}>
                  Parameters directly affect VFD operation and motor protection.<br/>
                  Enter the technician password to unlock editing.
                </div>
                <div style={{display:"flex",gap:8,justifyContent:"center",marginBottom:8}}>
                  <input type="password" value={paramPassword}
                    onChange={e=>{setParamPassword(e.target.value);setParamError(false);}}
                    onKeyDown={e=>{if(e.key==="Enter"){if(paramPassword==="439"){setParamUnlocked(true);setParamError(false);}else setParamError(true);}}}
                    placeholder="Enter password"
                    style={{...SINP(),width:160,textAlign:"center",fontSize:16,letterSpacing:"0.2em"}}/>
                  <button onClick={()=>{if(paramPassword==="439"){setParamUnlocked(true);setParamError(false);}else setParamError(true);}}
                    style={{padding:"7px 16px",background:T.accent,border:"none",borderRadius:6,color:"#fff",fontFamily:"'Nunito',sans-serif",fontWeight:800,cursor:"pointer"}}>Unlock</button>
                </div>
                {paramError && <div style={{color:T.red,fontSize:12,fontWeight:700}}>⚠ Incorrect password</div>}
                <div style={{marginTop:16,fontSize:11,color:T.textSub}}>Hint: same as the GFY VFD unlock code (P-14)</div>
              </div>
            ) : (
              <div>
                {/* Unlocked header */}
                <div style={{background:T.greenBg,border:`1px solid ${T.greenBd}`,borderRadius:8,padding:"8px 12px",marginBottom:14,display:"flex",alignItems:"center",justifyContent:"space-between"}}>
                  <span style={{color:T.green,fontWeight:800,fontSize:12}}>🔓 Parameter editor unlocked</span>
                  <button onClick={()=>{setParamUnlocked(false);setParamPassword("");}}
                    style={{padding:"4px 10px",background:T.redBg,border:`1px solid ${T.redBd}`,borderRadius:6,color:T.red,fontFamily:"'Nunito',sans-serif",fontWeight:800,fontSize:11,cursor:"pointer"}}>🔒 Lock</button>
                </div>

                {/* Warning */}
                <div style={{background:T.yellowBg,border:`1px solid ${T.yellowBd}`,borderRadius:8,padding:"10px 12px",marginBottom:14}}>
                  <div style={{fontWeight:800,color:T.yellow,fontSize:12,marginBottom:4}}>⚠ Critical — Read Before Editing</div>
                  <div style={{fontSize:12,color:T.textMid,lineHeight:1.6}}>
                    Incorrect values can damage the motor or create unsafe conditions. P-08 / motor FLA must always match the actual motor nameplate. Changes here affect every new parameter generation for this brand. Document your changes before saving.
                  </div>
                </div>

                {/* Brand selector */}
                <div style={{marginBottom:10}}>
                  <label style={{fontSize:11,fontWeight:800,color:T.textSub,display:"block",marginBottom:4}}>MANUFACTURER</label>
                  <select value={activeBrand} onChange={e=>setActiveBrand(e.target.value)} style={{...SINP(),cursor:"pointer"}}>
                    {Object.keys(edited).map(n=><option key={n}>{n}</option>)}
                  </select>
                </div>

                {/* How it works */}
                <div style={{background:T.accentLt,border:`1px solid ${T.accentBd}`,borderRadius:8,padding:"10px 12px",marginBottom:14,fontSize:11,color:T.textMid,lineHeight:1.7}}>
                  <strong>How parameter overrides work:</strong> The app auto-generates parameters from the built-in builder. If you add custom parameters below, they <em>replace</em> the auto-generated values entirely when you press "Generate VFD Parameters" in Fan Setup. Leave blank to use auto-generated values. Use <strong>[FLA]</strong> anywhere in a value to auto-insert the motor's actual FLA.
                </div>

                {/* Custom param rows editor */}
                {(()=>{
                  const overrides = edited[activeBrand]?.paramOverrides || [];
                  const setOverrides = (rows) => setEdited(p=>({...p,[activeBrand]:{...p[activeBrand],paramOverrides:rows}}));
                  const addRow = () => setOverrides([...overrides, {p:"P-XX", v:"", r:""}]);
                  const removeRow = (i) => setOverrides(overrides.filter((_,idx)=>idx!==i));
                  const updateRow = (i,field,val) => { const rows=[...overrides]; rows[i]={...rows[i],[field]:val}; setOverrides(rows); };

                  return (
                    <div>
                      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:8}}>
                        <div style={{fontWeight:800,fontSize:13,color:T.text}}>
                          Custom Parameter Rows — {activeBrand}
                        </div>
                        {overrides.length>0 && (
                          <button onClick={()=>{ if(confirm("Clear all custom parameters? Auto-generated values will be used instead.")) setOverrides([]);}}
                            style={{padding:"4px 10px",background:T.redBg,border:`1px solid ${T.redBd}`,borderRadius:6,color:T.red,fontFamily:"'Nunito',sans-serif",fontWeight:800,fontSize:11,cursor:"pointer"}}>
                            Clear All
                          </button>
                        )}
                      </div>

                      {overrides.length===0 ? (
                        <div style={{background:T.bg,border:`1.5px dashed ${T.border}`,borderRadius:8,padding:"20px",textAlign:"center",marginBottom:12}}>
                          <div style={{fontSize:12,color:T.textSub,marginBottom:8}}>No custom parameters set — auto-generated values are used.</div>
                          <div style={{fontSize:11,color:T.textSub}}>Add rows below to override. You can copy the auto-generated values from Fan Setup as your starting point.</div>
                        </div>
                      ) : (
                        <div style={{marginBottom:8}}>
                          {/* Column headers */}
                          <div style={{display:"grid",gridTemplateColumns:"90px 120px 1fr 32px",gap:6,marginBottom:4,padding:"0 4px"}}>
                            {["PARAM","VALUE","DESCRIPTION / REASON",""].map(h=>(
                              <div key={h} style={{fontSize:9,fontWeight:800,color:T.textSub,letterSpacing:"0.08em"}}>{h}</div>
                            ))}
                          </div>
                          {overrides.map((row,i)=>(
                            <div key={i} style={{display:"grid",gridTemplateColumns:"90px 120px 1fr 32px",gap:6,marginBottom:6,alignItems:"center"}}>
                              <input value={row.p} onChange={e=>updateRow(i,"p",e.target.value)}
                                placeholder="P-01"
                                style={{...SINP(),fontFamily:"monospace",fontWeight:800,color:T.accent,padding:"6px 8px"}}/>
                              <input value={row.v} onChange={e=>updateRow(i,"v",e.target.value)}
                                placeholder="e.g. 22 s"
                                style={{...SINP(),padding:"6px 8px"}}/>
                              <input value={row.r} onChange={e=>updateRow(i,"r",e.target.value)}
                                placeholder="Why this value / what it does"
                                style={{...SINP(),padding:"6px 8px"}}/>
                              <button onClick={()=>removeRow(i)}
                                style={{width:32,height:32,background:T.redBg,border:`1px solid ${T.redBd}`,borderRadius:6,color:T.red,fontFamily:"'Nunito',sans-serif",fontWeight:900,cursor:"pointer",fontSize:14}}>✕</button>
                            </div>
                          ))}
                        </div>
                      )}

                      <button onClick={addRow}
                        style={{width:"100%",padding:"10px",background:T.accentLt,border:`1.5px solid ${T.accentBd}`,borderRadius:8,color:T.accent,fontFamily:"'Nunito',sans-serif",fontWeight:800,fontSize:13,cursor:"pointer",marginBottom:12}}>
                        + Add Parameter Row
                      </button>

                      {/* Motor FLA quick-edit */}
                      <div style={{background:T.bg,border:`1px solid ${T.border}`,borderRadius:8,padding:12}}>
                        <div style={{fontWeight:800,fontSize:13,color:T.text,marginBottom:4}}>Motor FLA — Quick Edit</div>
                        <div style={{fontSize:11,color:T.textSub,marginBottom:10}}>Edit HP and FLA values per model. These auto-populate P-08 when a model is selected in Fan Setup.</div>
                        <div style={{maxHeight:280,overflowY:"auto"}}>
                          {/* Column headers */}
                          <div style={{display:"grid",gridTemplateColumns:"2fr 0.7fr 0.8fr 0.8fr",gap:6,marginBottom:4,padding:"0 4px"}}>
                            {["MODEL","HP","FLA@460V","FLA@230V"].map(h=>(
                              <div key={h} style={{fontSize:9,fontWeight:800,color:T.textSub,letterSpacing:"0.07em"}}>{h}</div>
                            ))}
                          </div>
                          {(edited[activeBrand]?.models||[]).filter(m=>m.hp||m.fla460).map((m,i)=>(
                            <div key={i} style={{display:"grid",gridTemplateColumns:"2fr 0.7fr 0.8fr 0.8fr",gap:6,marginBottom:5,alignItems:"center",padding:"5px 6px",background:"#fff",borderRadius:6,border:`1px solid ${T.border}`}}>
                              <div style={{fontSize:10,fontWeight:700,color:T.text,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap",lineHeight:1.2}}>{m.name}</div>
                              <input type="number" step="0.1" value={m.hp||""}
                                onChange={e=>{const models=[...(edited[activeBrand]?.models||[])];models[i]={...models[i],hp:parseFloat(e.target.value)||0};setEdited(p=>({...p,[activeBrand]:{...p[activeBrand],models}}));}}
                                style={{...SINP(),padding:"4px 5px",fontSize:11}}/>
                              <input type="number" step="0.1" value={m.fla460||""}
                                onChange={e=>{const models=[...(edited[activeBrand]?.models||[])];models[i]={...models[i],fla460:parseFloat(e.target.value)||0};setEdited(p=>({...p,[activeBrand]:{...p[activeBrand],models}}));}}
                                style={{...SINP(),padding:"4px 5px",fontSize:11}}/>
                              <input type="number" step="0.1" value={m.fla230||""}
                                onChange={e=>{const models=[...(edited[activeBrand]?.models||[])];models[i]={...models[i],fla230:parseFloat(e.target.value)||0};setEdited(p=>({...p,[activeBrand]:{...p[activeBrand],models}}));}}
                                style={{...SINP(),padding:"4px 5px",fontSize:11}}/>
                            </div>
                          ))}
                        </div>
                      </div>

                      <div style={{marginTop:10,fontSize:11,color:T.textSub,textAlign:"center"}}>💾 Tap <strong>Save</strong> at the top to commit all changes.</div>
                    </div>
                  );
                })()}
              </div>
            )}
          </div>}

          {/* VIDEOS tab */}
          {settingsTab==="videos" && <div>
            {/* Brand selector */}
            <div style={{marginBottom:14}}>
              <label style={{fontSize:11,fontWeight:800,color:T.textSub,display:"block",marginBottom:4}}>EDITING BRAND</label>
              <select value={activeBrand} onChange={e=>setActiveBrand(e.target.value)} style={{...SINP(),cursor:"pointer"}}>
                {Object.keys(edited).map(n=><option key={n}>{n}</option>)}
              </select>
            </div>
            <div style={{fontSize:12,color:T.textSub,marginBottom:12}}>Add YouTube or other video links. These appear in the Fan Setup tab when this brand is selected.</div>
            {(edited[activeBrand]?.videos||[]).map((v,i)=>(
              <div key={i} style={{border:`1.5px solid ${expandedVideo===i?T.purple:T.border}`,borderRadius:10,marginBottom:8,overflow:"hidden"}}>
                <div style={{display:"flex",alignItems:"center",gap:8,padding:"10px 12px",background:expandedVideo===i?T.purpleBg:T.bg,cursor:"pointer"}} onClick={()=>setExpandedVideo(expandedVideo===i?null:i)}>
                  <span style={{flex:1,fontWeight:700,fontSize:13,color:T.text}}>▶ {v.label||"Untitled video"}</span>
                  <button onClick={e=>{e.stopPropagation();const vids=(edited[activeBrand]?.videos||[]).filter((_,idx)=>idx!==i);setEdited(p=>({...p,[activeBrand]:{...p[activeBrand],videos:vids}}));setExpandedVideo(null);}}
                    style={{padding:"3px 8px",background:T.redBg,border:`1px solid ${T.redBd}`,borderRadius:4,color:T.red,fontFamily:"'Nunito',sans-serif",fontWeight:800,fontSize:11,cursor:"pointer"}}>Remove</button>
                </div>
                {expandedVideo===i && (
                  <div style={{padding:12}}>
                    {[["Video Title / Label","label"],["YouTube URL","url"],["Short Description","desc"]].map(([lbl,field])=>(
                      <div key={field} style={{marginBottom:8}}>
                        <label style={{fontSize:10,fontWeight:700,color:T.textSub,display:"block",marginBottom:3}}>{lbl}</label>
                        <input value={v[field]||""} onChange={e=>{const vids=[...(edited[activeBrand]?.videos||[])];vids[i]={...vids[i],[field]:e.target.value};setEdited(p=>({...p,[activeBrand]:{...p[activeBrand],videos:vids}}));}} style={SINP()}/>
                      </div>
                    ))}
                  </div>
                )}
              </div>
            ))}
            <button onClick={()=>{const vids=[...(edited[activeBrand]?.videos||[]),{label:"New Video",url:"https://youtube.com/watch?v=",desc:""}];setEdited(p=>({...p,[activeBrand]:{...p[activeBrand],videos:vids}}));setExpandedVideo(vids.length-1);}}
              style={{width:"100%",padding:"10px",background:T.purpleBg,border:`1.5px solid ${T.purpleBd}`,borderRadius:8,color:T.purple,fontFamily:"'Nunito',sans-serif",fontWeight:800,fontSize:13,cursor:"pointer"}}>+ Add Video Link</button>
          </div>}

        </div>
      </div>
    </div>
  );
}

// ─────────────────────────────────────────────────────────────────────────────

// Activated by Tab 9. Reads from the same `brands` state as the rest of the app,

function BrandPageSection({ title, icon, count, defaultOpen, children, sub, theme }) {
  const [open, setOpen] = useState(!!defaultOpen);
  return (
    <div style={{background:DT.surface, border:`1px solid ${DT.border}`,
                 borderRadius:12, marginBottom:10, overflow:"hidden"}}>
      <button onClick={()=>setOpen(o=>!o)}
        style={{width:"100%",border:"none",background:"transparent",
                padding:"14px 14px",display:"flex",alignItems:"center",
                gap:10,cursor:"pointer",textAlign:"left",
                borderLeft:`4px solid ${open?theme.primary:"transparent"}`,
                transition:"border-left-color 0.15s",color:DT.text,
                fontFamily:"'Nunito',sans-serif"}}>
        <div style={{fontSize:22,lineHeight:1,flexShrink:0}}>{icon}</div>
        <div style={{flex:1,minWidth:0}}>
          <div style={{fontWeight:900,fontSize:15,color:DT.text,
                       display:"flex",alignItems:"center",gap:8,flexWrap:"wrap"}}>
            {title}
            {typeof count === "number" && (
              <span style={{background:theme.primaryLt,color:theme.primary,
                            fontSize:11,fontWeight:800,padding:"1px 8px",
                            borderRadius:10,border:`1px solid ${theme.primary}40`}}>
                {count}
              </span>
            )}
          </div>
          {sub && <div style={{fontSize:11.5,color:DT.textSub,marginTop:2,
                                fontWeight:600,lineHeight:1.4}}>{sub}</div>}
        </div>
        <div style={{fontSize:18,color:DT.textSub,fontWeight:900,
                     transform:open?"rotate(90deg)":"rotate(0deg)",
                     transition:"transform 0.2s",flexShrink:0}}>›</div>
      </button>
      {open && <div style={{padding:"0 14px 14px 14px"}}>{children}</div>}
    </div>
  );
}

function BrandFanLogo({ theme, fg }) {
  const blades = Math.max(2, Math.min(theme.blades || 5, 8));
  const angles = Array.from({length: blades}, (_, i) => (360/blades)*i);
  return (
    <svg width="44" height="44" viewBox="0 0 100 100">
      <circle cx="50" cy="50" r="9" fill="#000"/>
      <circle cx="50" cy="50" r="4" fill={fg}/>
      {angles.map((a,i) => (
        <path key={i}
          d="M50 41 C55 28,70 18,73 27 C76 36,60 45,50 50 Z"
          fill={fg} stroke="#000" strokeWidth="1.5"
          transform={`rotate(${a} 50 50)`}/>
      ))}
    </svg>
  );
}

function BrandPageSpecPill({ label, val, theme }) {
  return (
    <div style={{background:DT.bg, border:`1px solid ${DT.border}`,
                  borderRadius:6, padding:"4px 7px"}}>
      <div style={{fontSize:9, fontWeight:700, color:theme.primary,
                    letterSpacing:0.5, textTransform:"uppercase"}}>{label}</div>
      <div style={{fontSize:12, fontWeight:800, color:DT.text,
                    fontFamily:"monospace", marginTop:1}}>{val}</div>
    </div>
  );
}

function BrandPageSevBadge({ sev }) {
  const s = (sev||"med").toLowerCase();
  const colors = {
    crit: { bg:DT.red,    fg:"#0F1419", label:"CRITICAL" },
    high: { bg:DT.orange, fg:"#0F1419", label:"HIGH" },
    med:  { bg:DT.yellow, fg:"#0F1419", label:"MED" },
    low:  { bg:DT.green,  fg:"#0F1419", label:"LOW" },
  };
  const c = colors[s] || colors.med;
  return (
    <span style={{background:c.bg, color:c.fg, fontSize:9.5, fontWeight:900,
                   padding:"2px 7px", borderRadius:4, letterSpacing:0.5,
                   flexShrink:0, fontFamily:"'Nunito',sans-serif"}}>
      {c.label}
    </span>
  );
}

function BrandPage({ brandKey, brandData, theme, onBack, onJumpToFanSetup }) {
  const [faultSearch, setFaultSearch] = useState("");
  const [faultOpenIdx, setFaultOpenIdx] = useState(null);
  const [noteOpenIdx, setNoteOpenIdx] = useState(null);
  const [modelFilter, setModelFilter] = useState("all");

  if (!brandKey || !brandData) {
    return (
      <div style={{background:DT.bg, minHeight:"100vh",
                    padding:"20px 16px", color:DT.text}}>
        <div style={{maxWidth:600, margin:"40px auto", textAlign:"center"}}>
          <div style={{fontSize:48, marginBottom:12}}>🏷</div>
          <div style={{fontSize:18, fontWeight:900, marginBottom:8}}>
            No Brand Selected
          </div>
          <div style={{fontSize:13, color:DT.textSub, marginBottom:20,
                        lineHeight:1.6}}>
            Pick a manufacturer in Fan Setup to view their full brand page —
            models, faults, field notes, manuals, and videos.
          </div>
          <button onClick={onJumpToFanSetup}
            style={{background:"#1D4ED8", color:"#fff", border:"none",
                    borderRadius:8, padding:"11px 22px", fontSize:13,
                    fontWeight:900, fontFamily:"'Nunito',sans-serif",
                    cursor:"pointer"}}>
            → Go to Fan Setup
          </button>
        </div>
      </div>
    );
  }

  const fgOnPrimary = theme.needsDarkText ? "#0F1419" : "#000";
  const fgHeader = theme.needsDarkText ? "#0F1419" : "#FFFFFF";
  const fgHeaderSec = theme.needsDarkText ? "rgba(15,20,25,0.75)" : "rgba(255,255,255,0.85)";
  const pillBg = theme.needsDarkText ? "rgba(0,0,0,0.18)" : "rgba(0,0,0,0.3)";
  const pillBorder = theme.needsDarkText ? "rgba(0,0,0,0.25)" : "rgba(255,255,255,0.3)";

  // Group models by family for the chip filter
  const groupKey = (m) => {
    if (m.name.includes(" — ")) return m.name.split(" — ")[0];
    if (m.name.startsWith("Z-Tech3")) return "Z-Tech3";
    if (m.name.startsWith("Z-Tech")) return "Z-Tech";
    if (m.name.startsWith("Z-Chill")) return "Z-Chill";
    if (m.name.startsWith("Powerfoil X4")) return "Powerfoil X4";
    if (m.name.startsWith("Powerfoil 8")) return "Powerfoil 8";
    if (m.name.startsWith("Basic 6")) return "Basic 6";
    if (m.name.startsWith("AirVolution")) return "AirVolution";
    if (m.name.startsWith("AirLegacy")) return "AirLegacy";
    if (m.name.startsWith("AVD")) {
      const mm = m.name.match(/^(AVD\d+|AVDX|AVD)/);
      return mm ? mm[1] : "AVD";
    }
    return m.name.split(/[\s—]+/)[0];
  };

  const models = brandData.models || [];
  const groups = {};
  models.forEach(m => {
    const k = groupKey(m);
    if (!groups[k]) groups[k] = [];
    groups[k].push(m);
  });
  const families = Object.keys(groups);
  const showFamilyChips = families.length > 1 && models.length > 5;
  const visibleModels = modelFilter==="all" ? models : (groups[modelFilter] || []);

  const filteredFaults = (brandData.faults||[]).filter(f => {
    if (!faultSearch) return true;
    const s = faultSearch.toLowerCase();
    return (f.code||"").toLowerCase().includes(s) ||
           (f.display||"").toLowerCase().includes(s) ||
           (f.label||"").toLowerCase().includes(s);
  });

  const chipStyle = (active) => ({
    padding:"5px 10px",
    background: active ? theme.primary : DT.surfaceLt,
    border:`1.5px solid ${active ? theme.primary : DT.border}`,
    color: active ? fgOnPrimary : DT.textMid,
    borderRadius:14, fontSize:11, fontWeight:800,
    cursor:"pointer", fontFamily:"'Nunito',sans-serif",
  });

  return (
    <div style={{background:DT.bg, minHeight:"100vh",
                  margin:"-14px -14px -14px -14px",
                  color:DT.text, fontFamily:"'Nunito',sans-serif"}}>
      {/* Back bar */}
      <div style={{background:DT.surface,
                    borderBottom:`1px solid ${DT.border}`,
                    padding:"8px 12px", display:"flex",
                    alignItems:"center", gap:10}}>
        <button onClick={onBack}
          style={{background:"transparent", color:DT.text,
                  border:`1px solid ${DT.borderLt}`, borderRadius:8,
                  padding:"6px 12px", fontSize:12, fontWeight:800,
                  cursor:"pointer", fontFamily:"'Nunito',sans-serif"}}>
          ← Back to Fan Setup
        </button>
        <div style={{fontSize:10.5, fontWeight:700,
                      color:DT.textDim, letterSpacing:1}}>
          BRAND PAGE
        </div>
      </div>

      {/* Brand header */}
      <div style={{background:`linear-gradient(180deg, ${theme.primary} 0%, ${theme.primaryDk} 100%)`,
                    color:fgHeader, padding:"18px 16px 16px 16px",
                    borderBottom:`3px solid #000`}}>
        <div style={{display:"flex", alignItems:"flex-start", gap:12}}>
          <div style={{flex:1, minWidth:0}}>
            <div style={{fontSize:11, letterSpacing:1.5, fontWeight:700,
                          opacity:0.85, textTransform:"uppercase", color:fgHeader}}>
              Brand Manual
            </div>
            <div style={{fontSize:24, fontWeight:900, lineHeight:1.1,
                          marginTop:2, letterSpacing:-0.5, color:fgHeader}}>
              {brandKey}
            </div>
            <div style={{fontSize:12.5, fontWeight:700, marginTop:3,
                          fontStyle:"italic", color:fgHeaderSec}}>
              {theme.tagline}
            </div>
          </div>
          <div style={{flexShrink:0, marginTop:2}}>
            <BrandFanLogo theme={theme} fg={fgHeader}/>
          </div>
        </div>
        <div style={{display:"flex", gap:6, flexWrap:"wrap", marginTop:12}}>
          {brandData.phone && (
            <a href={`tel:${brandData.phone.replace(/[^0-9]/g,'')}`}
               style={{background:pillBg, color:fgHeader,
                       padding:"4px 10px", borderRadius:14, fontSize:11.5,
                       fontWeight:800, textDecoration:"none",
                       border:`1px solid ${pillBorder}`}}>
              📞 {brandData.phone}
            </a>
          )}
          {brandData.website && (
            <a href={brandData.website} target="_blank" rel="noopener"
               style={{background:pillBg, color:fgHeader,
                       padding:"4px 10px", borderRadius:14, fontSize:11.5,
                       fontWeight:800, textDecoration:"none",
                       border:`1px solid ${pillBorder}`}}>
              🌐 {brandData.website.replace(/^https?:\/\/(www\.)?/, '')}
            </a>
          )}
          {brandData.vfd && (
            <span style={{background:pillBg, color:fgHeader,
                           padding:"4px 10px", borderRadius:14, fontSize:11.5,
                           fontWeight:800,
                           border:`1px solid ${pillBorder}`}}>
              ⚡ {brandData.vfd.length > 50 ? brandData.vfd.slice(0,48) + "…" : brandData.vfd}
            </span>
          )}
        </div>
      </div>

      <div style={{maxWidth:760, margin:"0 auto", padding:"14px 12px"}}>
        {/* Brand summary */}
        <div style={{background:DT.surface, border:`1px solid ${DT.border}`,
                      borderRadius:12, padding:14, marginBottom:10,
                      borderTop:`3px solid ${theme.primary}`}}>
          <div style={{fontSize:11, fontWeight:900, color:theme.primary,
                        letterSpacing:0.5, textTransform:"uppercase",
                        marginBottom:6}}>
            Brand Quick Reference
          </div>
          <div style={{fontSize:12.5, color:DT.textMid, lineHeight:1.6}}>
            {brandData.note}
          </div>
          {brandData.warningNote && (
            <div style={{marginTop:9, background:DT.yellowBg,
                          border:`1px solid ${DT.yellowBd}`,
                          borderRadius:7, padding:"8px 11px",
                          fontSize:12, color:DT.yellow, fontWeight:700,
                          lineHeight:1.5}}>
              {brandData.warningNote}
            </div>
          )}
        </div>

        {/* Models */}
        {models.length > 0 && (
          <BrandPageSection icon="📋" title="Fan Models" defaultOpen={true}
                    count={models.length} theme={theme}
                    sub={showFamilyChips ? "Tap a family chip to filter" : null}>
            {showFamilyChips && (
              <div style={{display:"flex", gap:5, flexWrap:"wrap",
                            marginBottom:10, marginTop:8}}>
                <button onClick={()=>setModelFilter("all")}
                  style={chipStyle(modelFilter==="all")}>
                  All ({models.length})
                </button>
                {families.map(f => (
                  <button key={f} onClick={()=>setModelFilter(f)}
                    style={chipStyle(modelFilter===f)}>
                    {f} ({groups[f].length})
                  </button>
                ))}
              </div>
            )}
            <div style={{display:"flex", flexDirection:"column", gap:8,
                          marginTop: showFamilyChips ? 0 : 8}}>
              {visibleModels.map((m, i) => (
                <div key={i} style={{background:DT.surfaceLt,
                                      border:`1px solid ${theme.primary}40`,
                                      borderLeft:`3px solid ${theme.primary}`,
                                      borderRadius:8, padding:"10px 11px"}}>
                  <div style={{display:"flex", alignItems:"baseline",
                                justifyContent:"space-between", gap:8,
                                marginBottom:4, flexWrap:"wrap"}}>
                    <div style={{fontWeight:900, fontSize:14, color:DT.text}}>
                      {m.name}
                    </div>
                    {m.hp && (
                      <div style={{background:theme.primary, color:fgOnPrimary,
                                    padding:"2px 8px", borderRadius:10,
                                    fontSize:11, fontWeight:900,
                                    fontFamily:"monospace"}}>
                        {m.hp}HP
                      </div>
                    )}
                  </div>
                  <div style={{display:"grid",
                                gridTemplateColumns:"repeat(auto-fit,minmax(85px,1fr))",
                                gap:6, marginTop:6}}>
                    {m.fla460 && <BrandPageSpecPill label="FLA@480V" val={m.fla460+"A"} theme={theme}/>}
                    {m.fla230 && <BrandPageSpecPill label="FLA@230V" val={m.fla230+"A"} theme={theme}/>}
                    {m.circuit && m.circuit !== "—" && <BrandPageSpecPill label="Min Fuse" val={m.circuit} theme={theme}/>}
                    {m.frame && <BrandPageSpecPill label="Frame" val={m.frame} theme={theme}/>}
                    {m.rpm && <BrandPageSpecPill label="RPM" val={m.rpm} theme={theme}/>}
                    {m.lbs && <BrandPageSpecPill label="Weight" val={m.lbs+" lbs"} theme={theme}/>}
                    {m.sqft && <BrandPageSpecPill label="Coverage" val={m.sqft.toLocaleString()+" ft²"} theme={theme}/>}
                    {m.clearBelow && <BrandPageSpecPill label="Below" val={m.clearBelow} theme={theme}/>}
                    {m.cfm && <BrandPageSpecPill label="CFM" val={typeof m.cfm === 'number' ? m.cfm.toLocaleString() : m.cfm} theme={theme}/>}
                  </div>
                  {m.note && (
                    <div style={{fontSize:11.5, color:DT.textMid, marginTop:7,
                                  lineHeight:1.5}}>
                      {m.note}
                    </div>
                  )}
                </div>
              ))}
            </div>
          </BrandPageSection>
        )}

        {/* Faults */}
        {(brandData.faults||[]).length > 0 && (
          <BrandPageSection icon="⚠️" title="VFD Fault Codes"
                    count={(brandData.faults||[]).length} theme={theme}
                    sub="Tap any code for cause + diagnostic steps">
            <div style={{marginTop:8}}>
              <input type="text" placeholder="🔍 Search code or fault"
                value={faultSearch} onChange={e=>setFaultSearch(e.target.value)}
                style={{width:"100%", padding:"9px 11px", borderRadius:7,
                        border:`1.5px solid ${DT.border}`, fontSize:13,
                        fontFamily:"'Nunito',sans-serif",
                        background:DT.surfaceLt, color:DT.text,
                        marginBottom:8}}/>
              <div style={{display:"flex", flexDirection:"column", gap:5}}>
                {filteredFaults.map((f, i) => {
                  const isOpen = faultOpenIdx === i;
                  return (
                    <div key={i} style={{background:DT.surfaceLt,
                                          border:`1px solid ${DT.border}`,
                                          borderRadius:8, overflow:"hidden"}}>
                      <button onClick={()=>setFaultOpenIdx(isOpen?null:i)}
                        style={{width:"100%", border:"none",
                                background:"transparent",
                                padding:"9px 11px", display:"flex",
                                alignItems:"center", gap:8, cursor:"pointer",
                                textAlign:"left", color:DT.text,
                                fontFamily:"'Nunito',sans-serif"}}>
                        <div style={{background:"#000", color:theme.primary,
                                      fontFamily:"monospace", fontWeight:900,
                                      padding:"3px 8px", borderRadius:5,
                                      fontSize:11.5, flexShrink:0,
                                      minWidth:70, textAlign:"center",
                                      border:`1px solid ${theme.primary}50`}}>
                          {f.display}
                        </div>
                        <div style={{flex:1, minWidth:0}}>
                          <div style={{fontSize:12.5, fontWeight:800,
                                        color:DT.text, lineHeight:1.3}}>
                            {f.label}
                          </div>
                        </div>
                        <BrandPageSevBadge sev={f.sev}/>
                        <span style={{fontSize:13, color:DT.textSub,
                                       fontWeight:900,
                                       transform:isOpen?"rotate(90deg)":"rotate(0deg)",
                                       transition:"transform 0.2s",
                                       flexShrink:0}}>›</span>
                      </button>
                      {isOpen && (
                        <div style={{padding:"0 11px 11px 11px"}}>
                          {f.cause && (
                            <div style={{background:DT.bg,
                                          border:`1px solid ${DT.border}`,
                                          borderLeft:`3px solid ${theme.primary}`,
                                          borderRadius:7, padding:"8px 11px",
                                          fontSize:12, color:DT.textMid,
                                          lineHeight:1.5, marginBottom:7}}>
                              <span style={{fontWeight:900, color:theme.primary,
                                             fontSize:10, letterSpacing:0.5,
                                             textTransform:"uppercase",
                                             marginRight:5}}>
                                Cause:
                              </span>
                              {f.cause}
                            </div>
                          )}
                          {f.steps && f.steps.length > 0 && (
                            <div>
                              <div style={{fontSize:10, fontWeight:900,
                                            color:DT.textSub, letterSpacing:0.5,
                                            textTransform:"uppercase",
                                            marginBottom:5}}>
                                Diagnostic Steps:
                              </div>
                              {f.steps.map((s, si) => (
                                <div key={si} style={{display:"flex", gap:8,
                                                       alignItems:"flex-start",
                                                       background:DT.bg,
                                                       border:`1px solid ${DT.border}`,
                                                       borderRadius:6,
                                                       padding:"7px 9px",
                                                       marginBottom:4}}>
                                  <div style={{background:theme.primary,
                                                color:fgOnPrimary,
                                                borderRadius:"50%",
                                                width:20, height:20,
                                                fontSize:11, fontWeight:900,
                                                display:"flex",
                                                alignItems:"center",
                                                justifyContent:"center",
                                                flexShrink:0}}>
                                    {si+1}
                                  </div>
                                  <div style={{flex:1, fontSize:12,
                                                color:DT.text, lineHeight:1.5}}>
                                    {s}
                                  </div>
                                </div>
                              ))}
                            </div>
                          )}
                        </div>
                      )}
                    </div>
                  );
                })}
              </div>
            </div>
          </BrandPageSection>
        )}

        {/* Field Notes */}
        {(brandData.fieldNotes||[]).length > 0 && (
          <BrandPageSection icon="📝" title="Field Notes"
                    count={(brandData.fieldNotes||[]).length} theme={theme}
                    sub="Wiring, programming, install procedures">
            <div style={{display:"flex", flexDirection:"column",
                          gap:7, marginTop:8}}>
              {brandData.fieldNotes.map((sec, si) => {
                const fc = NOTE_COLORS_DARK[sec.color] || NOTE_COLORS_DARK.blue;
                const isOpen = noteOpenIdx === si;
                return (
                  <div key={si} style={{background:fc.bg,
                                         border:`1.5px solid ${fc.border}`,
                                         borderRadius:10, overflow:"hidden"}}>
                    <button onClick={()=>setNoteOpenIdx(isOpen?null:si)}
                      style={{width:"100%", border:"none",
                              background:"transparent",
                              padding:"9px 11px", display:"flex",
                              alignItems:"center", gap:8,
                              cursor:"pointer", textAlign:"left",
                              fontFamily:"'Nunito',sans-serif"}}>
                      <span style={{background:fc.badge,
                                     border:`1px solid ${fc.border}`,
                                     borderRadius:14, padding:"2px 10px",
                                     fontSize:12, fontWeight:900,
                                     color:fc.head, flex:1, minWidth:0}}>
                        {sec.title}
                      </span>
                      <span style={{fontSize:13, color:fc.head,
                                     fontWeight:900,
                                     transform:isOpen?"rotate(90deg)":"rotate(0deg)",
                                     transition:"transform 0.2s"}}>›</span>
                    </button>
                    {isOpen && (
                      <div style={{padding:"0 11px 11px 11px"}}>
                        {(sec.steps||[]).map((step, i) => (
                          <div key={i} style={{display:"flex", gap:9,
                                                alignItems:"flex-start",
                                                background:"rgba(0,0,0,0.35)",
                                                borderRadius:7,
                                                padding:"8px 9px",
                                                border:`1px solid ${fc.border}80`,
                                                marginBottom:5}}>
                            <div style={{background:fc.head, color:DT.bg,
                                          borderRadius:5, padding:"2px 8px",
                                          fontWeight:900, fontSize:10.5,
                                          flexShrink:0, fontFamily:"monospace",
                                          minWidth:80, textAlign:"center"}}>
                              {step.param}
                            </div>
                            <div style={{flex:1, minWidth:0}}>
                              <div style={{fontWeight:800, fontSize:12.5,
                                            color:DT.text}}>
                                {step.value}
                              </div>
                              {step.note && (
                                <div style={{fontSize:11.5, color:DT.textSub,
                                              marginTop:1, lineHeight:1.5}}>
                                  {step.note}
                                </div>
                              )}
                            </div>
                          </div>
                        ))}
                        {sec.footer && (
                          <div style={{marginTop:6,
                                        background:"rgba(0,0,0,0.4)",
                                        borderRadius:7, padding:"8px 11px",
                                        fontSize:11.5, color:fc.head,
                                        fontWeight:700,
                                        border:`1px solid ${fc.border}`,
                                        lineHeight:1.6}}>
                            {sec.footer}
                          </div>
                        )}
                      </div>
                    )}
                  </div>
                );
              })}
            </div>
          </BrandPageSection>
        )}

        {/* Manuals */}
        {(brandData.manualLinks||[]).length > 0 && (
          <BrandPageSection icon="📚" title="Official Manuals & PDFs"
                    count={(brandData.manualLinks||[]).length} theme={theme}
                    sub={`Direct links to ${brandKey} docs`}>
            <div style={{display:"flex", flexDirection:"column",
                          gap:5, marginTop:8}}>
              {brandData.manualLinks.map((m, i) => (
                <a key={i} href={m.url} target="_blank" rel="noopener"
                   style={{display:"flex", alignItems:"center", gap:8,
                           background:DT.surfaceLt,
                           border:`1px solid ${DT.border}`,
                           borderRadius:7, padding:"9px 11px",
                           textDecoration:"none", color:DT.text}}>
                  <div style={{fontSize:16, flexShrink:0}}>📄</div>
                  <div style={{flex:1, minWidth:0, fontSize:12.5,
                                fontWeight:700, lineHeight:1.4, color:DT.text}}>
                    {m.label}
                  </div>
                  <div style={{fontSize:14, color:theme.primary,
                                fontWeight:900, flexShrink:0}}>↗</div>
                </a>
              ))}
            </div>
          </BrandPageSection>
        )}

        {/* Videos */}
        {(brandData.videos||[]).length > 0 && (
          <BrandPageSection icon="🎥" title="Training Videos"
                    count={brandData.videos.length} theme={theme}
                    sub="Manufacturer-provided training">
            <div style={{display:"flex", flexDirection:"column",
                          gap:6, marginTop:8}}>

                      {l:`FLA @ ${voltage}V`, v:motor.fla?`${motor.fla.toFixed(1)} A`:"N/A"},

                      {motor.lbs  && <span style={{background:"#fff",border:`1px solid ${T.border}`,borderRadius:6,padding:"4px 10px",fontSize:11,fontWeight:700,color:T.textMid}}>⚖ ~{motor.lbs} lbs</span>}

              {bdata && (
                <div style={{background:T.bg,border:`1px solid ${T.border}`,borderRadius:8,padding:"10px 12px",marginBottom:bdata.warningNote?10:0}}>
